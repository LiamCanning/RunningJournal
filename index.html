  var tot = 0, done = 0, end = addDays(ws[ws.length - 1].start, 6);
  ws.forEach(function(w){ tot += w.km; RUNS.forEach(function(r){ if (r.ds >= w.start && r.ds <= addDays(w.start, 6)) done += r.dist; }); });
  var html = '<div class="seg plan-seg">' + BLOCKS.map(function(x){ return '<button data-pblock="' + x.id + '" class="' + (x.id === PLAN_BLOCK ? 'on' : '') + '">' + x.name + '</button>'; }).join('') + '</div>' +
    '<div class="pb-sum"><div class="pb-goal">' + b.goal + '</div><div class="muted">' + b.race + ' · ' + ws.length + ' weeks, ' + fmtDay(ws[0].start).slice(4) + ' - ' + fmtDay(end).slice(4) + ' · ' + Math.round(done) + ' of ' + Math.round(tot) + ' km done</div></div>' +
    (b.id === 'gandia' ? paceTestHtml() : '') + '<div class="diary plan-scroll" id="plan-scroll">';
  ws.forEach(function(w, i){
    var we = addDays(w.start, 6), now = TODAY >= w.start && TODAY <= we, past = TODAY > we, dk = 0;
    RUNS.forEach(function(r){ if (r.ds >= w.start && r.ds <= we) dk += r.dist; });
    html += '<div class="pw' + (now ? ' now' : '') + (past ? ' done' : '') + '"' + (now ? ' id="pw-now"' : '') + '><div class="mo-h"><b>Week ' + (i + 1) + (wkTag(w) ? ' · ' + esc(wkTag(w)) : '') + (now ? ' <span class="chip red">This week</span>' : '') + '</b><span>' + fmtDay(w.start).slice(4) + ' · ' + (past || now ? Math.round(dk) + ' of ' : '') + w.km + ' km</span></div><div class="list">' + weekRows(w) + '</div></div>';
  });
  return html + '</div>';
}
function renderRunsLeft(){
  var mon = mondayOf(TODAY), el = document.getElementById('runs-left');
  el.innerHTML = RUNS_TAB === 'week' ? weekPanel(mon, '') + weekPanel(addDays(mon, -7), 'Last week') : planPanel();
  document.querySelectorAll('[data-rtab]').forEach(function(t){ t.classList.toggle('on', t.dataset.rtab === RUNS_TAB); });
  var now = document.getElementById('pw-now'), sc = document.getElementById('plan-scroll');
  if (now && sc) sc.scrollTop = now.offsetTop - sc.offsetTop;
}
function renderRunsList(){
  var months = {}, order = [];
  RUNS.forEach(function(r){ if (RUN_FILTER !== 'all' && kind(r.title) !== RUN_FILTER) return; var k = r.ds.slice(0, 7); if (!months[k]){ months[k] = []; order.push(k); } months[k].push(r); });
  var html = order.map(function(k){
    var list = months[k], tot = list.reduce(function(a, r){ return a + r.dist; }, 0), p = k.split('-');
    return '<div class="mo-h"><b>' + MONTHS[+p[1] - 1] + ' ' + p[0] + '</b><span>' + list.length + ' run' + (list.length === 1 ? '' : 's') + ' · ' + Math.round(tot) + ' km</span></div><div class="list">' + list.map(runRow).join('') + '</div>';
  }).join('') || '<p class="muted" style="padding:20px 0">Nothing here yet.</p>';
  document.getElementById('runs-list').innerHTML = html;
  document.querySelectorAll('[data-filt]').forEach(function(b){ b.classList.toggle('on', b.dataset.filt === RUN_FILTER); });
}
function renderRuns(){
  var ym = TODAY.slice(0, 7), y = TODAY.slice(0, 4), mKm = 0, yKm = 0, w4 = 0, nq = 0;
  RUNS.forEach(function(r){ if (r.ds.slice(0, 7) === ym) mKm += r.dist; if (r.ds.slice(0, 4) === y) yKm += r.dist; if (r.ds > addDays(TODAY, -28)) w4 += r.dist; if (kind(r.title) === 'quality' && r.ds.slice(0, 4) === y) nq++; });
  var mon = mondayOf(TODAY);
  var html = '<div class="kick">Every run, as it happened</div><h1>Runs</h1><p class="lede">Synced from your watch about once an hour. Tap a run for the splits, or a week on the chart for its runs.</p>' +
    '<div class="nums runs-nums">' +
      '<div class="num"><div class="l">' + MONTHS[+ym.slice(5) - 1] + '</div><div class="v">' + Math.round(mKm) + ' km</div></div>' +
      '<div class="num"><div class="l">' + y + ' so far</div><div class="v">' + Math.round(yKm).toLocaleString('en-GB') + ' km</div></div>' +
      '<div class="num"><div class="l">Last 4 weeks</div><div class="v">' + Math.round(w4 / 4) + ' km</div><div class="s">per week</div></div>' +
      '<div class="num"><div class="l">Interval and tempo sessions, ' + y + '</div><div class="v">' + nq + '</div><div class="s"><button data-filt="quality" class="lnk">See them all →</button></div></div></div>' +
    '<div id="wc-wrap">' + chartHtml() + '</div>' +
    '<div class="runs-two"><div><div class="rtabs"><button data-rtab="week">This week</button><button data-rtab="plan">Training plan</button></div><div id="runs-left"></div></div>' +
    '<div><div class="sec"><h2>Diary</h2><span class="ln"></span></div>' +
      '<div class="filters">' + FILTERS.map(function(f){ return '<button data-filt="' + f[0] + '">' + f[1] + '</button>'; }).join('') + '</div>' +
      '<div class="diary" id="runs-list"></div></div></div>';
  document.getElementById('pg-runs').innerHTML = html;
  renderRunsLeft(); renderRunsList();
}
document.addEventListener('mouseover', function(e){
  var b = e.target.closest('.wb'), tip = document.getElementById('wc-tip'); if (!tip) return;
  if (!b){ tip.classList.remove('on'); return; }
  var w = CHART_WEEKS[b.dataset.wk]; if (!w) return;
  tip.innerHTML = tipHtml(w); tip.classList.add('on');
  var box = b.closest('.wc').getBoundingClientRect(), r = b.getBoundingClientRect(), tw = tip.offsetWidth;
  var x = Math.min(Math.max(r.left + r.width / 2 - box.left - tw / 2, 8), box.width - tw - 8);
  tip.style.left = x + 'px'; tip.style.top = (b.querySelector('.wb-s').getBoundingClientRect().top - box.top - tip.offsetHeight - 10) + 'px';
});

// ===== RENDER: RACES =====
function renderRaces(){
  var races = RUNS.filter(function(r){ return kind(r.title) === 'race'; });
  var html = '<div class="kick">Results and what is next</div><h1>Races</h1>' +
    '<div class="split r56"><div class="col"><div>' + sec('Coming up') + '<div class="list">' + UPCOMING.map(function(u){
      var n = daysBetween(TODAY, u.date), d = dOf(u.date);
      return '<button class="row' + (u.focus ? ' today' : '') + '"' + (u.focus ? ' data-raceplan="1"' : '') + '><div class="d">' + MON[d.getMonth()] + '<b>' + d.getDate() + '</b></div><span class="dot ' + (u.focus ? 'tx' : '') + '"></span>' +
        '<div class="m"><div class="t">' + u.name + '</div><div class="s">' + u.dist + ' · goal ' + u.goal + (u.focus ? ' · entry closes Wed 4 Nov' : '') + '</div></div><div class="r">' + (n > 0 ? n + ' days' : 'done') + '</div></button>';
    }).join('') + '</div>' +
    sec('Personal bests') + '<div class="pbs">' + PBS.map(function(p){
      return '<div class="pb' + (p.empty ? ' empty' : '') + '"><div class="l">' + p.l + '</div><div class="v">' + p.v + '</div><div class="s">' + p.s + '</div></div>'; }).join('') + '</div></div></div><div class="col"><div>' +
    sec('Results', races.length + ' races') + '<div class="list">' + races.map(function(r){
      var i = RUNS.indexOf(r), d = dOf(r.ds);
      return '<button class="row" data-run="' + i + '"><div class="d">' + MON[d.getMonth()] + ' ' + String(d.getFullYear()).slice(2) + '<b>' + d.getDate() + '</b></div><span class="dot tx"></span>' +
        '<div class="m"><div class="t">' + esc(cleanTitle(r.title)) + '</div><div class="s">' + km1(r.dist) + ' km · ' + rp(r) + '/km' + (RACE_NOTE[r.ds] ? ' · debut marathon' : '') + '</div></div><div class="r">' + hms(r.secs) + '</div></button>';
    }).join('') + '</div></div></div></div>';
  document.getElementById('pg-races').innerHTML = html;
}

renderToday(); renderGym(); renderRuns(); renderRaces();
var start = location.hash.replace('#', '');
if (!start){ try { start = localStorage.getItem('rd_page') || ''; } catch(e) {} }
go(start || 'today', false);
})();

</script>
