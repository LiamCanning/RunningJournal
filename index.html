',n:'Or rest. Do not push - Sunday is the session.'}],desc:'Fri gym done. Sat 6-8km easy at 5:40+, HR under 145, or rest.'},{id:'long',day:'Sun 30',t:'Long run + 2x10min MP',c:'tl',rpe:'6',flex:false,club:false,km:26,min:150,ctx:'Two-part run. Leave 07:40, 17km easy via the beach to Palau de la Musica, arrive 09:15-09:21 to meet Kat at 09:30. Break 12min MAX - stay on your feet, keep walking, no sitting, no air conditioning, no cold drinks. Gel at the stop. Then a second half of about 9km carrying 2x10min at 4:55. All pace work sits in the second half, early - by 10:30 Valencia is 28-30C and that is not the hour to discover how MP feels. Total about 26km.',shoes:'<strong>NORMAL TRAINERS - not the DNE4s.</strong> Tomorrow is 26km with a mid-run stop, four days after a chest infection, in the heat. Adding a first-ever carbon-plate run on top means that if your calves hurt on Monday you will not know whether it was the shoes, the stop, the distance or the illness. Keep the variables separate. The DNE4s start on <strong>Tue 8 Sep</strong>, the 11km MP rehearsal in W15. Ten days away - nothing to do about them before then.',fuel:'Gel at 30 / 60 / 90min, plus one at the Palau stop. Four gels over 2h45 - good race rehearsal for fuelling.',why:'20min at MP at km 19-24, on tired legs, after a stop - that is specific work, not a token touch. Broken into two reps on purpose: the 3min float is the escape hatch, so you decide on rep 2 with real information instead of committing blind. Confirms 4:55 is still there before W14 opens with a 30km.',steps:[{l:'Warm-up',ty:'wu',d:'km 0-2.5',pace:'6:00+',hr:'<135',z:'Very easy',n:'Leave 07:40. Let the chest open up before you settle.'},{l:'Main set 1',ty:'main',d:'km 2.5-17',pace:'5:35-5:55',hr:'<150',z:'Easy',n:'Along the beach to Palau. All easy - no pace in this half. Arrive 09:15-09:21.'},{l:'Break',ty:'rest',d:'12min MAX',n:'Meet Kat. STAY ON YOUR FEET and keep walking. Do not sit, do not go inside into air conditioning, nothing cold to drink. Gel and water. This is the most injury-prone moment of the run - cold calves and achilles going straight back into pace.'},{l:'Re-warm',ty:'wu',d:'10min',pace:'5:50-6:00',z:'Easy',n:'Non-negotiable after the stop. No pace until this is done.'},{l:'MP rep 1',ty:'main',d:'10min',pace:'4:55',hr:'record it',z:'MP',n:'Hold 4:55 flat, do not drift quicker. If it costs more than about 165bpm, that is your answer on rep 2.'},{l:'Float',ty:'rest',d:'3min',pace:'easy',n:'The escape hatch. Decide here: rep 1 laboured, chest tight, or HR too high - jog home and be pleased with 10min at MP.'},{l:'MP rep 2',ty:'main',d:'10min',pace:'4:55',hr:'record it',z:'MP',n:'Only if rep 1 was honest. Same pace, no quicker.'},{l:'Cool-down',ty:'cd',d:'12min',pace:'6:00+',z:'Easy',n:'Finish around 10:35. Do NOT add a third rep.'}],desc:'<strong>Two-part long run, about 26km with 20min at marathon pace. Leave 07:40.</strong><br><br><strong>First half - 17km to Palau.</strong> km 0-2.5 at 6:00+, then 5:35-5:55 with HR under 150. All easy, no pace. Arrive 09:15-09:21 for a 09:30 meet. Gels at 30 / 60 / 90min.<br><br><strong>Break - 12min maximum.</strong> Stay standing and keep walking. No sitting, no air conditioning, nothing cold. Gel and water, then go.<br><br><strong>Second half - about 9km, 50min.</strong> 10min re-warm at 5:50-6:00, then <strong>10min at 4:55</strong>, 3min float, <strong>10min at 4:55</strong>, 12min cool-down. Finish around 10:35.<br><br><strong>Bail-out ladder:</strong><br>Chest tight or coughing - stop the pace work, jog home.<br>Legs flat after the break - re-warm, skip the reps, 30min easy, call it 22km.<br>Rep 1 fine, rep 2 grim - stop after the float. 10min at MP is a complete result.<br>All good - run it as written and stop. No third rep.<br><br>Record the HR for both reps.<br><br><strong>Green light for a firm 30km on 6 Sep.</strong>'}]},
  {id:'mbw14',wk:'MB W14 (Aug 31–Sep 6) - REBUILD',vol:'69km',tag:'',
   note:'A light week before the peak, not a deload - around 60km. You unload a little so the W15 peak long run lands well, but you keep building, not resting. Monday easy, Sunday solid but short of the peak.',
   sessions:[{id:'gym',day:'Mon 31',t:'Gym',c:'tr2',rpe:'2',flex:false,club:false,km:0,ctx:'Back to normal strength work if the chest is fully clear. Skip the heavy lifts if it is not.',steps:[{l:'Strength',ty:'main',d:'Gym',n:'Squats, hip thrusts, lunges, jumps, core. Ease back in - first strength session in over a week.'}],desc:'Gym. Ease back in after the illness week.'},{id:'flex',day:'Tue 1',t:'Easy + strides',c:'te',rpe:'3',flex:false,club:false,km:9,min:52,ctx:'Volume returns first. Strides only if the legs feel genuinely normal.',steps:[{l:'Main set',ty:'main',d:'9km',pace:'5:35-5:50',hr:'<145',z:'Easy'},{l:'Strides',ty:'rest',d:'4 x 20s',pace:'build to 4:10',n:'Walk back to full recovery. Skip these if anything feels off.'}],desc:'9km easy at 5:35-5:50, HR under 145, plus 4x20s strides.'},{id:'wed',day:'Wed 2',t:'Medium-long',c:'te',rpe:'4',flex:false,club:false,km:14,min:80,ctx:'Midweek medium-long - new addition. This is the cheapest way to add time on feet without adding another weekend long run. Steady, not fast.',steps:[{l:'Main set',ty:'main',d:'14km',pace:'5:30-5:45',hr:'140-150',z:'Easy'}],why:'Second-longest run of the week. Builds durability that a short easy day cannot.',desc:'14km steady at 5:30-5:45, HR 140-150. Midweek medium-long.'},{id:'club2',day:'Thu 3',t:'T-pace re-entry - DONE',c:'tq',rpe:'6',flex:true,club:false,km:10.4,min:60,ctx:'DONE Fri 4 Sep, moved from Thursday: 10.35km, three reps instead of four - 8min at 4:36 (HR 171), 8min at 4:29 (HR 175), then 10min at 4:35 (HR 174). 26min at threshold against 32min prescribed. Every rep landed inside the band with no pace decay, so the session was stopped because the reps ran out, not because the pace was going. Correct call in the heat, eight days off the infection. Recoveries ran long at 1:48 and 2:30 against 90s, which is part of why the last rep held 4:35 for ten minutes.',steps:[{l:'Warm-up',ty:'wu',d:'2km',pace:'5:40',hr:'<140',z:'Easy'},{l:'Main set',ty:'main',d:'4 x 8min',pace:'4:28-4:38',hr:'165-175',z:'Threshold'},{l:'Rest',ty:'rest',d:'90s',n:'Easy jog between reps.'},{l:'Cool-down',ty:'cd',d:'2km',z:'Easy'}],why:'32min at threshold, not the 50min peak session that was cancelled. Enough to wake the system up without digging a hole before Sunday.',desc:'<strong>DONE Fri 4 Sep - 10.35km, 3 reps: 8min @ 4:36, 8min @ 4:29, 10min @ 4:35.</strong><br><br>26min at threshold against 32min prescribed, every rep inside the 4:28-4:38 band, HR 171-175. Moved from Thursday and cut to three reps in the heat. The right call.'},{id:'club1',day:'Fri 4',t:'Easy - DONE',c:'te',rpe:'2',flex:false,club:false,km:7,min:40,ctx:'DONE Sat 5 Sep, shifted a day because the T-pace session moved to Friday: 8.10km easy, HR 133-155. Slightly over the 7km asked for, which was fine.',steps:[{l:'Main set',ty:'main',d:'7km',pace:'5:40-5:55',hr:'<145',z:'Easy'}],desc:'7km easy. Protect Sunday.'},{id:'long',day:'Sun 6',t:'LONG RUN - 32km DONE',c:'tl',rpe:'7',flex:false,club:false,km:30,min:178,ctx:'DONE Sun 6 Sep: 32.23km in 3h13 (about 3h02 moving), finishing with 5km at marathon pace. Prescribed was 30km steady with no MP block. PRESCRIBED, FOR THE RECORD - CHANGED after 30 Aug. You ran 30km with 63min at 4:53 (HR 154) on 30 Aug - a version of the peak session, two weeks early and five days after the illness. So this is now a pure aerobic 30km with NO MP block. Same distance, same time on feet, none of the intensity. You do not need more marathon-pace volume before 13 Sep, you need to absorb what you already did. Start 07:00.',shoes:'<strong>Normal trainers.</strong> DNE4 outing 1 is Wed 9 Sep.',fuel:'Full protocol: gel at 30 / 60 / 90min (non-caf), 110min (caf 75mg), 140min (non-caf). Water every 2km. Rehearse it exactly - the fuelling is the point of this run now that the pace is not.',why:'Durability and time on feet, nothing more. Running a second MP long run six days after 30 Aug, in a week following an illness, is how people arrive at the taper flat. Keep this aerobic and you turn up to the 13 Sep peak session fresh enough to do it justice - that session is the one that simulates race fatigue, because its MP block comes off 17km at 5:30, not 6:04.',steps:[{l:'Aerobic',ty:'wu',d:'24km',pace:'5:40-6:00',hr:'140-154',z:'Easy',n:'Disciplined - HR mostly under the 150 cap as asked.'},{l:'Ramp',ty:'main',d:'3km',pace:'5:10-5:30',hr:'164-172',z:'Steady',n:'Lifted out of easy into the block.'},{l:'Marathon pace',ty:'main',d:'5km',pace:'4:57 avg',hr:'159-168',z:'MP',n:'4:57, 4:56, 4:56, 4:57, 4:59. Three seconds of variation across five kilometres at HR 163, mid-band against a 160-170 target.'},{l:'Stops',ty:'rest',d:'~12min',n:'Two breaks, km 19 and km 24. The second landed immediately before the MP block.'}],desc:'<strong>DONE Sun 6 Sep - 32.23km in 3h13 (about 3h02 moving), finishing with 5km at marathon pace.</strong><br><br>24km aerobic at 5:40-6:00, HR 140-154. Then a 3km ramp at 5:10-5:30, then <strong>5km at 4:57, 4:56, 4:56, 4:57, 4:59, HR 159-168</strong>.<br><br><strong>The MP execution is the strongest sub-3:30 marker of the block.</strong> Three seconds of variation across five kilometres, at the end of a 32km run, at an average HR of 163 against an MP band of 160-170. Mid-band, not clinging on.<br><br><strong>What it cost:</strong> prescribed was 30km steady with no MP block. Running 32km with 25min of MP made this the biggest week of the block at 70.2km, in the week after the chest infection, and it means the peak long run has effectively been run seven days early. Tuesday 8 Sep was cut from 2x15min to 1x15min as a result.<br><br><strong>Caveat on the marker:</strong> roughly 12min of stopped time, including a 4min break immediately before the MP block, so those five kilometres were not run off fully continuous 30km fatigue.<br><br><strong>TOTAL: 32.23km.</strong>'}]},
  {id:'mbw15',wk:'MB W15 (Sep 7–13) – PEAK WEEK',vol:'77km',tag:'PEAK',
   note:'PEAK WEEK - COMPLETE. 80.7km against a 77km target, the biggest week of the block. The 32km race rehearsal moved forward to Sat 12 and was run in full; Sunday was taken as complete rest, and the closing 10.43km recovery run landed on Mon 14 and is counted here, not in the taper. Everything that needed to be banked is banked. The taper starts fresh on Tue 15 and fitness is now locked in.',
   sessions:[{id:'gym',day:'Mon',t:'Gym',c:'tr2',rpe:'2',flex:false,club:false,
     km:0,ctx:'Strength day - no run. Strength holds your form together in the last 10km of the marathon.',steps:[{l:'Strength',ty:'main',d:'Gym',n:'Club strength work: squats, hip thrusts, lunges, vertical jumps, skipping. Finish with core and 4min skipping.'}],desc:'<strong>Gym / strength - no run today (gym is Mon and Sat).</strong><br><br><strong>Session:</strong> club strength work - squats, hip thrusts, lunges, weighted and unweighted vertical jumps, skipping, at this week reps. Finish with core and 4min skipping.<br><br><strong>Why:</strong> strength holds your form together in the last 10km of the marathon. Keep it clear of Sunday legs.'},{id:'flex',day:'Tue 8',t:'Easy - DONE',c:'te',rpe:'3',flex:true,club:false,
     km:9,min:47,ctx:'DONE Tue 8 Sep: 9.01km easy, 5:36-6:22/km, HR 126-147. Run as pure easy volume - the 15min MP block moved to Wednesday and is folded into the medium-long. Correct call two days after the 32km.',why:'If it feels easy, good - that is what you want before the biggest long run of the block. Sunday 13 Sep is the only session this week that matters, and the job now is to arrive at it fresh.',steps:[{l:'Main set',ty:'main',d:'9km',pace:'5:36-6:22',hr:'126-147',z:'Easy',n:'Genuinely easy throughout. No MP block - it moved to Wednesday.'}],desc:'<strong>DONE Tue 8 Sep - 9.01km easy, HR 126-147.</strong><br><br>Run as pure easy volume, 5:36 to 6:22/km. The 15min marathon-pace block moved to Wednesday and is now folded into the 14km medium-long, so the week keeps its 77km and Sunday stays untouched.<br><br><strong>TOTAL: 9.01km.</strong>'},{id:'wed',day:'Wed 9',t:'Medium-long + 15min MP',c:'tq',rpe:'5',flex:false,club:false,km:14,min:78,ctx:'The MP rehearsal folded into the medium-long, after Tuesday was run easy. One session instead of two, same 14km, same 77km week. Block goes in early while the legs are fresh - this is a rehearsal and a shoe fitting, not a fatigue session.',shoes:'<strong>DNE4 - OUTING 1 of 4 - Wed 9 Sep.</strong> First ever run in the race shoes. Whole session in them, warm-up to cool-down. The carbon plate and high stack load the calves and achilles differently and that takes a few runs to adapt to. Check calves and achilles on Thursday morning and log it.',steps:[{l:'Warm-up',ty:'wu',d:'4km',pace:'5:40-5:50',hr:'<145',z:'Easy'},{l:'Main set',ty:'main',d:'15min',pace:'4:55',hr:'163-172',z:'MP',n:'One block, held exactly at 4:55. Do not add a second.'},{l:'Remainder',ty:'cd',d:'7km',pace:'5:30-5:45',hr:'140-150',z:'Easy',n:'Settle straight back down. No fast finish.'}],why:'Peak-week volume plus one touch of race pace, without spending a second day. Sunday 13 Sep stays the only session this week that matters.',desc:'<strong>14km medium-long with a 15min MP block. Total 14km.</strong><br><br><strong>WARM-UP:</strong> 4km easy @ 5:40-5:50/km, HR under 145.<br><strong>MAIN:</strong> 1 x 15min @ MP exactly 4:55/km, HR 163-172.<br><strong>REMAINDER:</strong> ~7km easy @ 5:30-5:45/km, HR 140-150.<br><br><strong>Why it is here:</strong> Tuesday was run easy, so the MP rehearsal moved rather than being dropped. Folding it into the medium-long keeps the week at 77km and avoids a second quality day. The block goes in early, on fresh legs - the point is to touch race pace and break in the DNE4, not to create fatigue.<br><br><strong>Hold it exactly at 4:55. No second block, no fast finish.</strong><br><br><strong>TOTAL: 14km.</strong>'},{id:'club2',day:'Thu',t:'Easy',c:'te',rpe:'3',flex:false,club:false,
     km:11,min:63,ctx:'Easy aerobic with strides. In heat run to HR and let the pace sit where it wants.',why:'Pure aerobic volume - the running that actually builds the marathon. Not a second quality day.',steps:[{l:'Main set',ty:'main',d:'11km',pace:'5:35-5:55',hr:'140-148',z:'Easy'},{l:'Strides',ty:'rest',d:'4 × 20s',pace:'build to 4:10',n:'In the last 2km. Walk back to full recovery after each.'}],desc:'<strong>Easy aerobic - 11km. Our session, not club.</strong><br><br><strong>Pace:</strong> 5:35-5:55/km (Z2, ~65% VAM). <strong>HR:</strong> 140-148, hard cap 148. <strong>RPE:</strong> 3.<br><br>Conversational the whole way. In heat, run to HR and let pace sit where it wants.<br><br><strong>Strides (last 2km):</strong> 4 x 20s, build to 4:10/km, walk back to full recovery each.<br><br><strong>Why:</strong> pure aerobic volume - the running that actually builds the marathon.'},{id:'club1',day:'Fri',t:'Easy',c:'te',rpe:'2-3',flex:false,club:false,km:11,min:63,ctx:'Genuinely easy - if unsure, go slower. In heat add 20-30s/km and run to HR, not pace.',steps:[{l:'Main set',ty:'main',d:'11km',pace:'5:40-5:50',hr:'<145 (cap 148)',z:'Easy'}],why:'Aerobic volume with zero stress - the quality was Tuesday, the long run is Sunday. This day protects both.',desc:'11km easy @ 5:40-5:50/km, HR <145 (cap 148). All volume, no stress - quality was Tuesday, Sunday is the long run.'},{id:'long',day:'Sat 12',t:'PEAK LONG RUN - DONE','c':'tl',rpe:'9',flex:false,club:false,
     km:32,min:165,ctx:'DONE Sat 12 Sep, a day early: 32.00km in 3:11:43, avg HR 162, max 185. Blocks run as 60min at 5:28, 30min at 4:50, then 60min at 5:06. Highest average HR of any long run in the block and the hardest session Liam has done. Under-fuelled at about 28g of carbs an hour and over-drinking from the fountains, which is what the late drift and the nausea were. Not a failure: 16km of the run sat at 5:00/km average, including 30 minutes dead level at 5:00 starting from km 19. PRESCRIBED WAS: PEAK LONG RUN. 32km with 60min at marathon pace - this is what race day feels like. PACE RULE: run every kilometre at MP effort - never chase a block average. If the pace will not come in the first 10-15min, that IS your MP effort for the day in those conditions: hold it and let the clock read what it reads. Never run quicker than 4:52 to pull an average down.',shoes:'<strong>Normal trainers.</strong> The DNE4s do not come out again until Sun 20 Sep (outing 3) - by then you will have run in them twice, on Tue 8 and Tue 15 Sep. Do not risk a 32km peak session in shoes you have only run in twice.',fuel:'<strong>WHAT ACTUALLY HAPPENED: 4 gels across 3h11 = about 28g of carbohydrate an hour, against a 47-60g target, plus heavy fountain drinking.</strong><br><br>That combination is the whole explanation for the last 4km and for feeling sick. 28g/hr is not enough carbohydrate to make anyone nauseous - the litre of water sitting on top of it was. Isotonic gels need no water, and the extra fluid diluted the stomach and slowed emptying to a crawl.<br><br><strong>Fix carried into race day:</strong> SiS Beta Fuel, 40g a gel, isotonic so NO water with it. Five gels at km 7, 14, 21, 28, 35 = 200g = 57g/hr. Sip to thirst only, never a full cup.<br><br><strong>Still to test on 20 Sep:</strong> 3 Beta Fuel at 25 / 60 / 95min, no water alongside, at marathon pace not easy pace. If that holds, the race plan is proven exactly as written - five gels at 57g/hr - and nothing changes.',why:'The legs that finish this can finish Cologne. By the end you will know your race-day plan. Log everything.',steps:[{l:'Block 1 - easy',ty:'wu',d:'60min',pace:'5:28 actual',hr:'136-152',z:'Easy',n:'Prescribed 5:35-5:45 at HR under 145. Ran quicker and hotter than asked - HR 149-152 from km 2. This is where the late drift was bought.'},{l:'Block 2 - LT1',ty:'main',d:'30min',pace:'4:50 actual',hr:'151-170',z:'LT1',n:'Prescribed 4:54. Ran 4:47-4:55 and HR actually fell through the block, 170 down to 151. Strong.'},{l:'Block 3 - MP',ty:'main',d:'60min',pace:'5:06 actual',hr:'168-177',z:'MP',n:'Prescribed 4:57. Km 19-24 held 5:00 dead level for 30 minutes, then drifted 5:05, 5:07, 5:15, 5:23. HR reached 177, which is LT2 - the pace read as MP but cost threshold.'},{l:'Breaks',ty:'rest',d:'~8min total',n:'Between blocks, not within them. No stop inside any single block.'},{l:'Finish',ty:'cd',d:'15min',pace:'5:40',hr:'<150',z:'Easy'},{l:'Cool-down',ty:'cd',d:'10min',n:'Easy walk or jog.'}],desc:'<strong>DONE Sat 12 Sep (a day early) - 32.00km in 3:11:43, avg HR 162, max 185.</strong><br><br><strong>Blocks:</strong> 60min at 5:28, 30min at 4:50, 60min at 5:06. No stop inside any block; roughly 8min of breaks between them.<br><br><strong>The number that matters:</strong> 16km of this run averaged 5:00/km, including <strong>30 minutes dead level at 5:00 starting from km 19</strong> - 5:00, 4:59, 5:01, 5:01, 5:00, 5:00. Marathon target is 4:58. That is the result, and it was produced on empty.<br><br><strong>Why it drifted:</strong> three things, and none of them are present on race day. Under-fuelled at ~28g carbs/hr against a 47-60g target. Over-drinking from the fountains, which caused the nausea. And it was peak week, off 70km, in about 23-26C with 60% humidity, with the MP block starting at km 19 on legs that had already run 24.<br><br>Highest average HR (162) and highest max HR (185) of any long run in the block. By heart rate this was objectively the hardest session of the whole eighteen weeks, which is exactly how it felt.<br><br><strong>TOTAL: 32.00km. Block complete.</strong>'},{id:'sun13',day:'Sun 13',t:'Recovery run - DONE',c:'te',rpe:'2',flex:false,club:false,km:0,min:62,ctx:'DONE Mon 14 Sep, a day late: 10.43km in 1:02:29, avg HR 143, max 165, 5:41/km. Sunday itself was full rest because the peak 32km moved forward to Saturday, so this run closes out peak week rather than opening the taper. It counts to W15, not W16 - the taper starts fresh on Tue 15.',steps:[{l:'Main set',ty:'main',d:'10.43km',pace:'5:41',hr:'143 avg / 165 max',z:'Easy',n:'48 hours after the 32km. Ran it genuinely easy, which was the only correct call.'}],why:'The read that matters is the heart rate. 143 average at 5:41/km, two days after a 32km that averaged 162 and peaked at 185, means the hardest session of the block was absorbed rather than survived. Slightly more expensive than a fresh easy run - 5:18 was costing 141-143 earlier in the block - so there is residual fatigue, which is exactly what 48 hours after a peak long run should look like. Nothing here argues against starting the taper on schedule.',desc:'<strong>DONE Mon 14 Sep - 10.43km in 1:02:29, avg HR 143, max 165, 5:41/km.</strong><br><br>The peak long run moved forward to Sat 12, so Sunday was taken as complete rest and this easy run landed on the Monday instead. It is logged against last week and counted in the W15 total, not the taper.<br><br><strong>The number that matters:</strong> HR 143 at 5:41/km, 48 hours after a 32km that averaged 162 and hit 185. A touch dearer than the 5:18 at 141-143 you were running earlier in the block, so there is residual fatigue in the legs - normal, and nothing that changes the taper.<br><br><strong>W15 closes at 80.7km against a 77km target. Peak week complete.</strong>'}]},
 ]},
 {phase:'taper',label:'Marathon Block – Taper + Race (Sep 14–Oct 4)',cls:'taper',pnote:'Trust the taper. Volume drops sharply. Legs will feel heavy on days 5–10  -  that’s glycogen supercompensation, not detraining. Short, sharp sessions only. Sleep, eat, rest. The work is done.',weeks:[
  {id:'mbw16',wk:'MB W16 (Sep 14–20)',vol:'52km',tag:'',
   note:'Taper week one - COMPLETE. 51.9km against the revised 53km target. The Monday easy run was counted back to peak week and Tuesday was taken as rest, so the week landed near 53km instead of 58 - correct, not a shortfall. Wed 12.7km, Thu 6.2km, Fri 11km, Sun 22.0km. Three straight sessions showed the same thing: faster paces at lower heart rates. The Wednesday sharpener beat its pace band while staying under its HR band, Thursday ran 5:31 at HR 131 against 5:41 at HR 143 three days earlier, and Sunday held 4:48 for 35 minutes at HR 169 in 30C against 5:06 at HR 168-177 on the 32km eight days before. The taper has arrived. The fuelling test passed on every visible marker. The one flag is discipline: Sunday was prescribed at 4:55 with a 4:52 ceiling and ran at 4:48 for five minutes longer than asked. Fitness is no longer the question two weeks out. Restraint in the first 15km of Cologne is.',
   sessions:[{id:'gym',day:'Mon',t:'Gym',c:'tr2',rpe:'2',flex:false,club:false,
     km:0,ctx:'Strength day - no run. Strength holds your form together in the last 10km of the marathon.',steps:[{l:'Strength',ty:'main',d:'Gym',n:'Club strength work: squats, hip thrusts, lunges, vertical jumps, skipping. Finish with core and 4min skipping.'}],desc:'<strong>Gym / strength - no run today (gym is Mon and Sat).</strong><br><br><strong>Session:</strong> club strength work - squats, hip thrusts, lunges, weighted and unweighted vertical jumps, skipping, at this week reps. Finish with core and 4min skipping.<br><br><strong>Why:</strong> strength holds your form together in the last 10km of the marathon. Keep it clear of Sunday legs.'},{id:'flex',day:'Tue 15',t:'Rest - taken',c:'tr2',rpe:'1',flex:false,club:false,km:0,ctx:'Rest day, taken deliberately. The sharpener was slid to Wednesday, which the session itself allowed ("if Sunday left the legs dead, slide this to Wednesday, never later"). Three days after a 32km that averaged HR 162, the extra day was the right call and the Wednesday numbers proved it.',steps:[{l:'Rest',ty:'cd',d:'Rest',n:'No run. Legs still refilling after the peak long run.'}],why:'Correct use of the escape hatch built into the sharpener. The session was not missed, it was moved.',desc:'<strong>Rest - the T-pace sharpener moved to Wed 16.</strong><br><br>Taken as full rest three days after the 32km. The sharpener carried its own permission to slide to Wednesday, and it was used properly. The Wednesday session then came out faster than prescribed at a lower heart rate, which settles the argument.'},{id:'wed',day:'Wed 16',t:'T-pace sharpener - DONE',c:'tq',rpe:'6',flex:false,club:false,km:12.7,min:74,ctx:'DONE Wed 16 Sep: 12.68km in 1:13:53, avg HR 150, max 182. Reps of 8min at 4:29 / 4:21 / 4:19, HR 160 / 156 / 169, two-minute standing recoveries. Prescribed was 4:28-4:38 at HR 165-175. He beat the pace band while staying under the heart rate band, which is the cleanest taper signal in the whole block. Subjectively: hard to get up to speed and the legs felt heavy early, improving as the session went on, cardiovascular system strong throughout. That is glycogen supercompensation, and it is exactly what the session text predicted.',shoes:'<strong>DNE4 - OUTING 2 of 4 - DONE Wed 16 Sep.</strong> Second outing, at threshold, no niggle reported during the session. Carbon-plate soreness in the calves and achilles shows up 24 hours later, not at the time, so the real clearance is Thursday morning. If Thursday is clean the shoes are proven and outing 3 is the 23km on Sun 20 Sep.',steps:[{l:'Warm-up',ty:'wu',d:'5.23km',pace:'5:27',hr:'140',z:'Easy',n:'Longer than the 2km prescribed. Given how heavy the legs felt, the extra warm-up was the right instinct.'},{l:'Rep 1',ty:'main',d:'8min',pace:'4:29',hr:'160',z:'Threshold',n:'Bang on the prescribed 4:28-4:38, but 5bpm under the HR band. This is the rep that felt heavy.'},{l:'Recovery',ty:'rest',d:'2min',n:'Standing. HR fell to 133 - strong cardiac recovery.'},{l:'Rep 2',ty:'main',d:'8min',pace:'4:21',hr:'156',z:'Threshold',n:'THE REP OF THE BLOCK. 8 sec/km quicker than rep 1 at 4bpm LOWER heart rate. Free speed.'},{l:'Recovery',ty:'rest',d:'2min',n:'Standing. HR 139.'},{l:'Rep 3',ty:'main',d:'8min',pace:'4:19',hr:'169',z:'Threshold',n:'Quickest rep, and the only one inside the prescribed HR band. Max 182 at the end. LT2 is around 177, so still controlled.'},{l:'Cool-down',ty:'cd',d:'1.7km',pace:'5:35',hr:'151',z:'Easy'}],why:'Two reads matter. First, the pace-for-heart-rate: on the 32km four days earlier the MP block drifted to 5:06 and cost HR 168-177. Today 4:19 cost 169. Same heart rate, 47 sec/km quicker. That is not four days of fitness, it is four days of fatigue being removed - the taper arriving on schedule. Second, cadence rose through the session: 167spm in the warm-up, then 174, 176, 176 across the reps. Fatigue lowers cadence. Rising cadence means recruitment was improving as the session went on, which is why it felt easier the deeper in he got.',desc:'<strong>DONE Wed 16 Sep - 12.68km in 1:13:53, avg HR 150, max 182.</strong><br><br><strong>3 x 8min:</strong> 4:29 (HR 160), 4:21 (HR 156), 4:19 (HR 169). Two-minute standing recoveries. Prescribed was 4:28-4:38 at HR 165-175.<br><br><strong>The headline:</strong> he beat the pace band while staying under the heart rate band. Only the final rep even reached the target HR. Faster than asked, for less than asked.<br><br><strong>The rep that matters:</strong> rep 2 was 8 sec/km quicker than rep 1 at 4bpm lower heart rate.<br><br><strong>Against Saturday:</strong> the 32km MP block drifted to 5:06 at HR 168-177. This was 4:19 at HR 169. Same heart rate, 47 sec/km faster, four days later.<br><br><strong>Heavy legs, strong lungs</strong> - reported exactly as written in the prescription. Glycogen binds roughly 3g of water per gram stored, so refilling the tank genuinely adds weight to the legs in taper week one. It is the tank filling, not fitness leaving.<br><br><strong>Recovery markers the same morning:</strong> HRV 83 (block baseline 63-71, and 55 the day after the 32km), RHR 41 (lowest of the block), sleep 8h07 at score 94. Supercompensation confirmed.<br><br><strong>DNE4 outing 2 complete. TOTAL: 12.68km.</strong>'},{id:'club2',day:'Thu 17',t:'Easy - DONE',c:'te',rpe:'3',flex:false,club:false,km:6.2,min:40,ctx:'DONE Thu 17 Sep: 6.18km in 40:09, avg HR 131, max 149. Evening run. Splits progressed 7:10, 6:12, 6:54, 6:26, 6:36, 5:52, 5:36 at HR 123 up to 138 - the slow early kilometres and the elapsed-versus-moving gap are traffic lights, not fatigue. Prescribed was 6km at 5:35-5:55 with HR 140-148 and 4 x 20s strides. He ran it well under the HR band and the strides do not show in the lap data.',steps:[{l:'Main set',ty:'main',d:'6.18km',pace:'5:31 moving',hr:'131 avg / 149 max',z:'Easy',n:'Progressive and genuinely easy throughout. HR never reached the prescribed 140-148 band, which is the correct way to get this day wrong.'},{l:'Strides',ty:'rest',d:'4 x 20s',n:'Not visible in the lap data. No consequence this close to the race - Wednesday already supplied the neuromuscular work.'}],why:'The efficiency read keeps improving. On 14 Sep he ran 5:41 at HR 143. Three days later, 5:31 at HR 131 - ten seconds a kilometre quicker for twelve beats fewer. That is the taper still deepening, not a one-off good day.',desc:'<strong>DONE Thu 17 Sep - 6.18km in 40:09, avg HR 131, max 149.</strong><br><br><strong>Splits:</strong> 7:10, 6:12, 6:54, 6:26, 6:36, 5:52, 5:36, HR climbing gently from 123 to 138. The gap between elapsed and moving pace is traffic lights on an evening run, not fading.<br><br><strong>Prescribed:</strong> 6km at 5:35-5:55, HR 140-148, plus 4 x 20s strides. He ran it comfortably under the HR band, which is the right way to get an easy day wrong. The strides do not appear in the data and do not matter now - Wednesday covered that work.<br><br><strong>The number worth keeping:</strong> 5:41 at HR 143 on 14 Sep became 5:31 at HR 131 on 17 Sep. Ten seconds a kilometre quicker for twelve beats fewer, three days apart.<br><br><strong>TOTAL: 6.18km.</strong>'},{id:'club1',day:'Fri 18',t:'Easy - DONE',c:'te',rpe:'2-3',flex:false,club:false,km:11,min:65,ctx:'DONE Fri 18 Sep: 11km in 1h05, about 5:55/km, logged as "Recuperacion". Prescribed was 8km at 5:40-5:50. Longer and slower than written, which in taper week is the right direction to miss in - the extra 3km is easy aerobic and costs nothing, while 5:55 is properly recovered rather than drifting towards steady. Recorded on the phone rather than the watch, so lap and heart rate detail is pending.',steps:[{l:'Main set',ty:'main',d:'11km',pace:'~5:55',hr:'pending',z:'Easy',n:'Phone-recorded. Full lap and HR data will backfill once intervals.icu finishes ingesting the file.'}],why:'Aerobic volume with zero stress two days before the fuelling test. Slower than prescribed is the correct error in taper week - the quality was Wednesday, Sunday is the session that matters, and this day protects both.',desc:'<strong>DONE Fri 18 Sep - 11km in 1h05, about 5:55/km.</strong><br><br>Prescribed was 8km at 5:40-5:50. Ran longer and easier, which is the right way to miss a taper prescription.<br><br><strong>Conditions:</strong> 15-27C. <strong>Morning markers:</strong> 83kg, resting HR 43.<br><br><strong>Data note:</strong> recorded on the phone, so lap splits and heart rate are not in yet. intervals.icu has registered the activity but has not downloaded the file from Strava, and the dashboard reads intervals.icu rather than Strava directly. It will backfill on its own once that clears.<br><br><strong>TOTAL: ~11km.</strong>'},{id:'long',day:'Sun 20',t:'FUELLING TEST - DONE 22km',c:'tl',rpe:'7',flex:false,club:false,km:22,min:118,ctx:'DONE Sun 20 Sep: 22.01km in 1:57:48, avg pace 5:14, avg HR 157, max 180, in 30C. Three blocks: 13.66km / 75min at 5:29 (HR 149), then 7.3km / 35min at 4:48 (HR 169), then 1.04km at 5:08 before the cool-down. Reported as feeling good. Prescribed was 30min at 4:55 with an explicit ceiling of 4:52 - he ran 35min at 4:48, so five minutes longer and seven seconds a kilometre quicker than the instruction allowed. The outcome was fine and the fitness read is excellent, but the discipline miss is the one thing worth correcting before 4 Oct. ORIGINAL BRIEF: the last session that changes anything, and it is a fuelling test before it is a running session. The 32km on 12 Sep was run at about 28g of carbohydrate an hour against a 47-60g target, with heavy fountain drinking on top, and the last 4km fell apart because of it. The race plan now asks for 200g across five isotonic gels with no water alongside. None of that has ever been tested at marathon pace. Today tests it. The running is the easy part - hold 4:55 and let the stomach answer the question.',shoes:'<strong>DNE4 - OUTING 3 of 4 - Sun 20 Sep.</strong> The important one: 23km, the longest run in them before Cologne, with 30min at MP inside it. Full race kit as well - shorts, vest, socks, cap, and the gels in the pocket you will actually use on the day. Nothing unrehearsed after this.',fuel:'<strong>THE TEST: 3 x SiS Beta Fuel at 25min / 60min / 95min. NO WATER WITH ANY OF THEM.</strong><br><br>120g of carbohydrate across 1h55 = about <strong>63g an hour</strong>. That is deliberately higher than race day (57g/hr) so there is headroom on 4 Oct. The spacing is identical to the race: one 40g gel every 35 minutes, which at 4:58/km is every 7km.<br><br><strong>The gel that matters is the third one, at 95min - taken 20 minutes INTO the marathon-pace block.</strong> Swallowing a gel at 4:55/km with a working stomach is the single thing that has never been rehearsed, and it is what km 28 and km 35 will demand.<br><br><strong>WATER RULE: sip to thirst only, never a full cup, and nothing within 10 minutes either side of a gel.</strong> Beta Fuel is formulated isotonic. Water on top of it is what diluted the stomach on 12 Sep and caused the nausea - the carbohydrate did not.<br><br><strong>PASS:</strong> no nausea, no sloshing, no bloating, the third gel goes down at pace without gagging, and the MP block holds 4:55 to the end. If it passes, the race plan is proven as written and nothing changes.<br><br><strong>FAIL:</strong> nausea, a sloshing stomach, or needing to back off. If that happens the race drops to SiS GO Isotonic 22g gels at the same 35-minute spacing (about 38g/hr) and we run a more conservative first marathon. Either answer is useful. Report honestly - there is no wrong result today, only an untested one.<br><br><strong>RESULT: PASS. CONFIRMED BY LIAM 20 SEP - the fuel worked well and NO WATER was taken with any gel.</strong> Three Beta Fuel at 25 / 60 / 95 minutes, 120g across 1h58, about 61g an hour, in 30C. No nausea, no sloshing, no backing off. Gel three went down at marathon pace, which was the one thing in the entire plan that had never been rehearsed. <strong>The race nutrition plan is now proven and closed: five Beta Fuel at 57g/hr, no water with any of them. Nothing changes.</strong> The 12 Sep collapse is formally diagnosed as a fuelling failure and formally solved.',why:'Two weeks out, no session can add fitness, so this one has to remove risk instead. The 12 Sep collapse was a fuelling failure, not a fitness failure, and it is the only thing between you and the finish that is still unproven. Test the gels at race pace now and the last 10km of Cologne stops being a guess.',steps:[{l:'Opening block',ty:'wu',d:'13.66km / 75min',pace:'5:29',hr:'149 avg',z:'Easy-Steady',n:'Prescribed 15min easy then 60min at 5:30-5:45. Splits ran 5:55, 5:40, 5:38, 5:40, 5:34, 5:33, 5:30, 5:22, 5:25, 5:26, 5:22, 5:19, 5:18 with HR climbing 132 to 160. Slightly quicker than the band by the end, and the HR creep from 145 to 160 at the same pace is heat, not fatigue - it was 30C.'},{l:'MP block',ty:'main',d:'7.3km / 35min',pace:'4:48',hr:'169 avg',z:'MP+',n:'THE HEADLINE. Splits 4:55, 4:47, 4:45, 4:49, 4:43, 4:48 with HR 164.7 rising to 174.8. Prescribed was 4:55 flat with a hard ceiling of 4:52. He ran 4:48 for 35 minutes. Cadence ROSE from 85.5 to 87.3 through it (171 to 175 steps a minute), so recruitment was improving, not failing. The 10bpm drift across six kilometres at flat pace is the honest signal that 4:48 sits above his true marathon ceiling.'},{l:'Run-out',ty:'main',d:'1.04km',pace:'5:08',hr:'167',z:'Steady',n:'Pace came off the MP block cleanly rather than collapsing off it. Nothing like 12 Sep.'},{l:'Cool-down',ty:'cd',d:'~1km',pace:'5:57 / 5:07',z:'Easy',n:'Km 21 at 5:57 and km 22 at 5:07 on 4-5m of climb.'},{l:'GEL PLAN AS WRITTEN',ty:'rest',d:'25 / 60 / 95min',n:'3 x SiS Beta Fuel 40g, no water with any of them, gel 3 taken 20min into the MP block. Confirm each one went in on time and the test is closed.'}],desc:'<strong>DONE Sun 20 Sep - 22.01km in 1:57:48, avg HR 157, max 180, in 30C.</strong><br><br><strong>WHAT HE RAN:</strong> 13.66km / 75min at 5:29 (HR 149), then <strong>7.3km / 35min at 4:48 (HR 169)</strong>, then 1.04km at 5:08 and a cool-down.<br><br><strong>The number that settles the marathon question:</strong> on 12 Sep the 32km MP block drifted to 5:06 and cost HR 168-177. Today, eight days later and in 30C heat, 4:48 cost HR 169. Eighteen seconds a kilometre quicker for the same heart rate, in worse conditions.<br><br><strong>Cadence rose inside the MP block</strong> - 85.5 to 87.3 - so recruitment was improving as it went on. Fatigue lowers cadence. This is the second session in a week showing the same thing.<br><br><strong>The correction:</strong> the prescription said hold 4:55 and named 4:52 as the ceiling. He ran 4:48 for 35 minutes instead of 30. The outcome was fine because 22km is not 42km, but running seven seconds a kilometre quicker than the plan is precisely the error that ended the 12 Sep run and precisely the error that ends marathons at km 32. Race day discipline is now the last remaining variable.<br><br><strong>HR drift inside the block</strong> - 164.7 up to 174.8 over six kilometres at flat pace - is the evidence that 4:48 is above his marathon ceiling, not at it. Heat accounts for part of it. Pace accounts for the rest.<br><br><strong>ORIGINAL BRIEF BELOW.</strong><br><br><strong>THE SESSION:</strong> 15min easy, 60min at 5:30-5:45, <strong>30min at 4:55 held flat</strong>, 10min easy.<br><br><strong>THE TEST: 3 x SiS Beta Fuel at 25 / 60 / 95min. NO WATER WITH ANY OF THEM.</strong> 120g across 1h55 = about 63g/hr, deliberately above the 57g/hr race rate so there is headroom on the day. Same 35-minute spacing the race uses.<br><br><strong>Gel 3 is the one that matters</strong> - taken 20 minutes into the marathon-pace block. Taking a gel at 4:55/km is the one thing never rehearsed, and it is what km 28 and km 35 will ask for.<br><br><strong>WATER:</strong> sip to thirst only, never a full cup, nothing within 10 minutes either side of a gel. The nausea on 12 Sep was water diluting the stomach, not the carbohydrate.<br><br><strong>PASS:</strong> no nausea, no sloshing, gel 3 goes down at pace, MP block holds 4:55. Race plan proven, nothing changes.<br><br><strong>FAIL:</strong> drop to SiS GO Isotonic 22g at the same spacing (~38g/hr) and run a more conservative race. Both answers are useful - report it honestly.<br><br><strong>DNE4 outing 3 complete, plus full race kit. Nothing unrehearsed after today.</strong><br><br><strong>TOTAL: 22.01km.</strong>'}]},
  {id:'mbrw1',wk:'MB W17 (Sep 21–27)',vol:'51km',tag:'',
   note:'Volume drops sharply. Legs should feel fresh and slightly restless by midweek  -  that’s the taper working. Let it happen.',
   sessions:[
    {id:'gym',day:'Mon',t:'Gym',c:'tr2',rpe:'2',flex:false,club:false,
     km:0,ctx:'Strength day - no run. Strength holds your form together in the last 10km of the marathon.',steps:[{l:'Strength',ty:'main',d:'Gym',n:'Club strength work: squats, hip thrusts, lunges, vertical jumps, skipping. Finish with core and 4min skipping.'}],desc:'<strong>Gym / strength - no run today (gym is Mon and Sat).</strong><br><br><strong>Session:</strong> club strength work - squats, hip thrusts, lunges, weighted and unweighted vertical jumps, skipping, at this week reps. Finish with core and 4min skipping.<br><br><strong>Why:</strong> strength holds your form together in the last 10km of the marathon. Keep it clear of Sunday legs.'},
    {id:'club1',day:'Tue',t:'Aerobic',c:'tq',rpe:null,flex:false,club:false,
     km:11,min:62,ctx:'Your midweek aerobic block. Controlled and even, not a race.',why:'Main midweek aerobic volume. If you go to a club session instead, run that and tell me.',steps:[{l:'Warm-up',ty:'wu',d:'2km',pace:'5:40',hr:'<140',z:'Easy'},{l:'Main set',ty:'main',d:'8km',pace:'5:20-5:40',hr:'140-150',z:'Easy (top)',n:'Controlled and even. Steady aerobic running, never a grind.'},{l:'Strides',ty:'rest',d:'4 × 20s',pace:'build to 4:10',n:'Walk back to full recovery after each.'},{l:'Cool-down',ty:'cd',d:'1km',z:'Easy'}],desc:'<strong>Aerobic session (our plan) - 11km.</strong><br><br><strong>WARM-UP:</strong> 2km easy @ 5:40/km, HR under 140.<br><strong>MAIN:</strong> 8km steady @ 5:20-5:40/km, HR 140-150 (Z2 top), controlled and even.<br><strong>STRIDES:</strong> 4 x 20s, build to 4:10/km, walk back.<br><strong>COOL-DOWN:</strong> 1km easy.<br><br><strong>Why:</strong> your main midweek aerobic block. Controlled, not a race. If you go to a club session instead, run that and tell me.'},
    {id:'wed',day:'Wed',t:'Easy',c:'te',rpe:'2',flex:false,club:false,
     km:4,min:25,ctx:'Movement only, not training. The Nocturna 15K is Saturday.',why:'Keeps the legs from going stale so you arrive at the race fresh.',steps:[{l:'Main set',ty:'main',d:'20-25min',pace:'5:45-5:55',hr:'<135',z:'Easy'}],desc:'<strong>Very easy shakeout - movement only, not training. Total ~4km.</strong><br><br><strong>MAIN:</strong> 20-25min very easy @ 5:45-5:55/km, HR under 135 (Z1).<br><strong>COOL-DOWN:</strong> 5min walk.<br><br><strong>Why:</strong> the Nocturna 15K is Saturday. This keeps the legs from going stale so you arrive fresh. Run the Nocturna at MP effort - a confidence builder, not a race to bury yourself in.<br><br><strong>TOTAL: ~4km.</strong>'},
    {id:'club2',day:'Thu',t:'Easy',c:'te',rpe:'3',flex:false,club:false,
     km:6,min:34,ctx:'Easy aerobic with strides. In heat run to HR and let the pace sit where it wants.',why:'Pure aerobic volume - the running that actually builds the marathon. Not a second quality day.',steps:[{l:'Main set',ty:'main',d:'6km',pace:'5:35-5:55',hr:'140-148',z:'Easy'},{l:'Strides',ty:'rest',d:'4 × 20s',pace:'build to 4:10',n:'In the last 2km. Walk back to full recovery after each.'}],desc:'<strong>Easy aerobic - 6km. Our session, not club.</strong><br><br><strong>Pace:</strong> 5:35-5:55/km (Z2, ~65% VAM). <strong>HR:</strong> 140-148, hard cap 148. <strong>RPE:</strong> 3.<br><br>Conversational the whole way. In heat, run to HR and let pace sit where it wants.<br><br><strong>Strides (last 2km):</strong> 4 x 20s, build to 4:10/km, walk back to full recovery each.<br><br><strong>Why:</strong> pure aerobic volume - the running that actually builds the marathon.'},
    {id:'flex',day:'Fri',t:'Easy + strides',c:'te',rpe:'2–3',flex:false,club:false,
     km:6.5,min:35,ctx:'Race-week-eve taper. If the legs feel bouncy, the taper is working - do not add to this.',why:'Strides keep the legs sharp without costing recovery.',steps:[{l:'Main set',ty:'main',d:'30-35min',pace:'5:35-5:50',hr:'<140',z:'Easy'},{l:'Strides',ty:'rest',d:'4 × 20s',pace:'build to 4:10',n:'Walk back each time.'},{l:'Cool-down',ty:'cd',d:'5min',n:'Walk.'}],desc:'<strong>Easy plus strides - race-week-eve taper. Total ~6.5km.</strong><br><br><strong>MAIN:</strong> 30-35min easy @ 5:35-5:50/km, HR under 140 (Z2).<br><strong>STRIDES:</strong> 4 x 20s, build to 4:10/km, walk back each.<br><strong>COOL-DOWN:</strong> 5min walk.<br><br><strong>Why:</strong> strides keep the legs sharp without costing recovery. If they feel fresh and bouncy, the taper is working. Do not add to this.<br><br><strong>TOTAL: ~6.5km.</strong>'},
    {id:'nocturna',day:'Sat 26',t:'15K Nocturna',c:'tx',rpe:'5–6',flex:false,club:false,
     km:18,min:95,ctx:'Evening race, 8 days out. A marathon-pace rehearsal, NOT a race to win. Kit, shoes and gels exactly as Cologne. Shoes = DNE4, outing 4 and final verdict: after tonight nothing new before the marathon.',shoes:'<strong>DNE4 - OUTING 4 of 4 - Sat 26 Sep, final verdict.</strong> Race kit and race shoes exactly as Cologne. After tonight nothing new: no new shoes, socks, kit, gels or supplements. If the shoes are not right by this evening, you race in trainers and that is a perfectly good outcome.',fuel:'One gel every ~30min, as Cologne. Evening race: main meal early afternoon (3-4h before), light. Do NOT rehearse race-morning breakfast here.',why:'Holding 4:57 for 15K comfortably confirms sub-3:30 with margin. Cologne is a morning race - do the breakfast rehearsal on a morning long run instead.',steps:[{l:'Warm-up',ty:'wu',d:'2km',z:'Easy',n:'Then 4 × 20s strides - time it so you are warm at the gun.'},{l:'Main set',ty:'main',d:'15km',pace:'4:57',hr:'160-170',z:'MP',n:'Hold MP from the gun, relaxed. Do not chase people.'},{l:'Cool-down',ty:'cd',d:'1km',n:'Easy walk.'}],desc:'<strong>15K Nocturna Valencia - EVENING race, MP rehearsal (not a race to win). Total ~18km.</strong><br><br><strong>WARM-UP:</strong> 2km easy, then 4 x 20s strides - time it so you are warm by gun time.<br><strong>MAIN - 15km at MP:</strong> 4:57/km, HR 160-170 (Z3). Hold MP from the gun, relaxed - the full distance at marathon effort.<br><strong>COOL-DOWN:</strong> 1km easy walk.<br><br><strong>FUEL:</strong> one gel every ~30min, exactly as Cologne. Evening race - eat your main meal early afternoon (3-4h before), light. Do NOT rehearse your race-morning breakfast here.<br><br><strong>Why:</strong> resist the start-line adrenaline, do not chase people. Holding 4:57 for 15K comfortably confirms sub-3:30 with margin. Cologne is a Sunday morning race, so do the breakfast-and-timing rehearsal on a morning long run, not here.<br><br><strong>TOTAL: ~18km.</strong>'},
    {id:'long',day:'Sun',t:'Easy run',c:'te',rpe:'2',flex:false,club:false,
     km:5,min:30,ctx:'Morning after the Nocturna. If in doubt, rest.',why:'Flush the legs, nothing more. Six days to Cologne - the only job is arriving fresh.',steps:[{l:'Main set',ty:'main',d:'25-35min',pace:'5:45-6:00',hr:'<135',z:'Easy',n:'Or take the day fully off if the legs are sore. Run by feel.'}],desc:'<strong>Recovery jog - morning after the Nocturna. Total ~5km, or full rest.</strong><br><br><strong>MAIN:</strong> 25-35min very easy @ 5:45-6:00/km, HR under 135 (Z1) - or take the day fully off if last night left the legs sore. Run by feel.<br><strong>COOL-DOWN:</strong> 5min walk.<br><br><strong>Why:</strong> flush the legs, nothing more. Six days to Cologne - the work is done, the only job is arriving fresh. If in doubt, rest.<br><br><strong>TOTAL: ~5km (optional).</strong>'}
   ]},
  {id:'mbrw2',wk:'MB W18 – Race Week (Sep 28–Oct 4)',vol:'Race week',tag:'RACE WEEK',
   note:'Kit is ready. Number is pinned. Trust the 18 weeks. Your only job this week is to arrive at the start line healthy, rested, and hungry.',
   sessions:[
    {id:'mon',day:'Mon',t:'Gym',c:'tr2',rpe:'2',flex:false,club:false,
     km:0,ctx:'Race-week gym - LIGHT only. You race in 6 days.',steps:[{l:'Strength',ty:'main',d:'Light',n:'Mobility, core and light activation only, no heavy loads. Finish with 4 × 20s strides and an optional 20min very easy jog.'}],desc:'<strong>Race-week gym - LIGHT only. No running load.</strong><br><br>Mobility, core and light activation, no heavy loads (you race in 6 days). Finish with 4 x 20s strides and an optional 20min very easy jog.<br><br><strong>Why:</strong> everything now is about arriving at the start line fresh.'},
    {id:'club1',day:'Tue',t:'Aerobic',c:'tq',rpe:null,flex:false,club:false,
     km:5,min:30,ctx:'Race week - easy only.',why:'Keep the legs turning over, nothing more.',steps:[{l:'Main set',ty:'main',d:'30min',pace:'5:40-5:55',hr:'<140',z:'Easy',n:'30min maximum. No reps, no efforts.'}],desc:'<strong>Race-week easy - 30min max. ~5km.</strong><br><br><strong>MAIN:</strong> up to 30min very easy @ 5:40-5:55/km, HR under 140 (Z2). No reps, no efforts.<br><br><strong>Why:</strong> keep the legs turning over, nothing more.<br><br><strong>TOTAL: ~5km.</strong>'},
    {id:'wed',day:'Wed',t:'Easy',c:'te',rpe:'2',flex:false,club:false,
     km:3,min:20,ctx:'Three days out. Your job this week is rest.',why:'Legs are resting; mobility keeps the joints fluid. No quality, no strides, no extra km.',steps:[{l:'Main set',ty:'main',d:'15-20min',pace:'5:50-6:00',hr:'<130',z:'Easy'},{l:'Mobility',ty:'cd',d:'10min',n:'Hip circles, leg swings, calf stretches. Nothing that raises HR.'}],desc:'<strong>Very easy plus mobility - three days out. Total ~3km.</strong><br><br><strong>MAIN:</strong> 15-20min very easy @ 5:50-6:00/km, HR under 130 (Z1). Then 10min mobility: hip circles, leg swings, calf stretches.<br><br><strong>Why:</strong> legs are resting, mobility keeps the joints fluid. No quality, no strides, no extra km. Your job this week is rest.<br><br><strong>TOTAL: ~3km.</strong>'},
    {id:'thu',day:'Thu',t:'Rest',c:'tr2',rpe:null,flex:false,club:false,
     km:0,ctx:'Three days out. Carb load starts today.',fuel:'<strong>CARB LOAD DAY 1 OF 3 - THE TRANSITION. Target about 500g carbs (6g per kg at 83kg).</strong><br><br>Three normal meals, carbs as the biggest thing on every plate, plus two snacks. Cooked veg is still fine today; salad and raw veg start going.<br><br><strong>Breakfast:</strong> 2 white bagels with honey, banana, glass of orange juice (about 160g).<br><strong>Snack:</strong> 3 rice cakes with jam (about 35g).<br><strong>Lunch:</strong> 125g dry white rice (a large plate cooked) with chicken and soy sauce, small portion of cooked carrots (about 105g).<br><strong>Snack:</strong> banana and 500ml sports drink or juice (about 60g).<br><strong>Dinner:</strong> 125g dry white pasta with plain tomato sauce and chicken or tuna, 2 slices white bread (about 120g).<br><strong>Evening:</strong> low-fat yoghurt with honey (about 30g).<br><br><strong>TOTAL: about 510g.</strong><br><br><strong>THE RULES FOR ALL THREE DAYS:</strong> white and plain beats brown and wholesome. Carbs up, fibre down, fat down, protein normal but in smaller portions. Nothing new, nothing spicy, no cream sauces, no pizza, no fried food, no alcohol (that includes the Kolsch until Sunday afternoon). Salt your food more than usual: a 17-20C race means sweat, and sodium on board helps you hold fluid.<br><br><strong>EAT FREELY:</strong> white rice, white pasta, white bread and bagels, peeled boiled potatoes, gnocchi, plain cereals (Corn Flakes, Rice Krispies), rice cakes, bananas, honey, jam, orange juice, sports drink, jelly sweets, rice pudding, low-fat yoghurt, chicken, turkey, eggs, white fish.<br><br><strong>CUT FROM FRIDAY:</strong> wholegrain anything, oats, bran, pulses and beans, salad and raw veg, fruit skins, nuts and seeds, dried fruit, broccoli and cabbage, fizzy drinks, sugar-free sweets (sorbitol).<br><br><strong>EXPECT TO WEIGH 1-2kg MORE ON SUNDAY.</strong> Every gram of glycogen stores about three grams of water with it. That is not fat, it is fuel, and it is the scale telling you the load worked.<br><br><strong>DRINK TO PALE-YELLOW URINE</strong>, roughly 2.5-3 litres a day. Do not force it. Sipping sports drink across the day does two jobs at once.',steps:[{l:'Rest',ty:'cd',d:'Rest',n:'Or a 15min walk. Kit prep.'}],desc:'<strong>Rest.</strong> Or a 15min walk. Kit prep.'},
    {id:'fri',day:'Fri',t:'Rest',c:'tr2',rpe:null,flex:false,club:false,
     km:0,ctx:'Eve of race eve. The main carb-load day.',fuel:'<strong>CARB LOAD DAY 2 OF 3 - THE BIG ONE. Target about 700g carbs (8.5g per kg).</strong><br><br>This is where the loading actually happens. Low fibre starts today. It will feel like too much food: spread it across six sittings rather than forcing huge plates, and top up with liquid carbs, which do not fill you up.<br><br><strong>Breakfast:</strong> 80g Corn Flakes or Rice Krispies with milk, banana, 300ml orange juice, 1 slice white toast with honey (about 165g).<br><strong>Mid-morning:</strong> 2 white bagels with jam (about 125g).<br><strong>Lunch:</strong> 150g dry white rice with chicken, salted, soy sauce (about 120g).<br><strong>Afternoon:</strong> 500ml sports drink plus 50g jelly sweets (about 70g).<br><strong>Dinner:</strong> 150g dry white pasta with plain tomato sauce, a little parmesan, chicken or turkey, 2 slices white bread (about 145g).<br><strong>Evening:</strong> rice pudding or yoghurt with honey, banana (about 65g).<br><br><strong>TOTAL: about 690g.</strong> This is the most important night of sleep of the week, so eat dinner by 20:00.<br><br><strong>THE RULES FOR ALL THREE DAYS:</strong> white and plain beats brown and wholesome. Carbs up, fibre down, fat down, protein normal but in smaller portions. Nothing new, nothing spicy, no cream sauces, no pizza, no fried food, no alcohol (that includes the Kolsch until Sunday afternoon). Salt your food more than usual: a 17-20C race means sweat, and sodium on board helps you hold fluid.<br><br><strong>EAT FREELY:</strong> white rice, white pasta, white bread and bagels, peeled boiled potatoes, gnocchi, plain cereals (Corn Flakes, Rice Krispies), rice cakes, bananas, honey, jam, orange juice, sports drink, jelly sweets, rice pudding, low-fat yoghurt, chicken, turkey, eggs, white fish.<br><br><strong>CUT FROM FRIDAY:</strong> wholegrain anything, oats, bran, pulses and beans, salad and raw veg, fruit skins, nuts and seeds, dried fruit, broccoli and cabbage, fizzy drinks, sugar-free sweets (sorbitol).<br><br><strong>EXPECT TO WEIGH 1-2kg MORE ON SUNDAY.</strong> Every gram of glycogen stores about three grams of water with it. That is not fat, it is fuel, and it is the scale telling you the load worked.<br><br><strong>DRINK TO PALE-YELLOW URINE</strong>, roughly 2.5-3 litres a day. Do not force it. Sipping sports drink across the day does two jobs at once.',steps:[{l:'Rest',ty:'cd',d:'Rest',n:'Full rest. Pin bib, lay everything out, early night.'}],desc:'<strong>Full rest.</strong> Pin your bib, lay everything out, early night.'},
    {id:'sat',day:'Sat',t:'Shakeout 5km',c:'te',rpe:'2',flex:false,club:false,
     km:5,min:30,ctx:'Day before Cologne. Big meal at lunch, not dinner.',fuel:'<strong>CARB LOAD DAY 3 OF 3 - RACE EVE. Target about 650g carbs (8g per kg).</strong><br><br>The shift today is timing: <strong>the big meal is LUNCH, not dinner.</strong> A huge pasta dinner at 21:00 is still sitting in your gut at the 10:30 gun. Dinner is smaller, plainer, and finished by 19:00.<br><br><strong>After the shakeout:</strong> 2 white bagels with honey, banana, 300ml orange juice (about 190g).<br><strong>Mid-morning:</strong> one Laugenbrezel (a plain German pretzel, any bakery) and 500ml sports drink (about 80g).<br><strong>LUNCH, the main meal (13:00):</strong> 150g dry white pasta or rice with a plain tomato sauce and chicken, white bread roll (about 140g).<br><strong>Afternoon:</strong> 4 rice cakes with jam, banana (about 80g).<br><strong>Dinner by 19:00:</strong> 125g dry white rice with chicken or eggs, salted. Nothing else on the plate (about 100g).<br><strong>Evening:</strong> 40g jelly sweets or a sports drink, sipped (about 35g).<br><br><strong>TOTAL: about 625g.</strong> Stop eating by 21:00. Race breakfast is 07:30, three hours before the gun.<br><br><strong>IN COLOGNE:</strong> an Italian restaurant ordering plain pasta with tomato sauce is the safest meal in the city. Ask for no garlic bread, no cream, no side salad. Book it for Saturday lunch now; every runner in Cologne wants a table that night.<br><br><strong>THE RULES FOR ALL THREE DAYS:</strong> white and plain beats brown and wholesome. Carbs up, fibre down, fat down, protein normal but in smaller portions. Nothing new, nothing spicy, no cream sauces, no pizza, no fried food, no alcohol (that includes the Kolsch until Sunday afternoon). Salt your food more than usual: a 17-20C race means sweat, and sodium on board helps you hold fluid.<br><br><strong>EAT FREELY:</strong> white rice, white pasta, white bread and bagels, peeled boiled potatoes, gnocchi, plain cereals (Corn Flakes, Rice Krispies), rice cakes, bananas, honey, jam, orange juice, sports drink, jelly sweets, rice pudding, low-fat yoghurt, chicken, turkey, eggs, white fish.<br><br><strong>CUT FROM FRIDAY:</strong> wholegrain anything, oats, bran, pulses and beans, salad and raw veg, fruit skins, nuts and seeds, dried fruit, broccoli and cabbage, fizzy drinks, sugar-free sweets (sorbitol).<br><br><strong>EXPECT TO WEIGH 1-2kg MORE ON SUNDAY.</strong> Every gram of glycogen stores about three grams of water with it. That is not fat, it is fuel, and it is the scale telling you the load worked.<br><br><strong>DRINK TO PALE-YELLOW URINE</strong>, roughly 2.5-3 litres a day. Do not force it. Sipping sports drink across the day does two jobs at once.',steps:[{l:'Km 1-2',ty:'wu',d:'2km',pace:'5:55-6:05',hr:'<135',z:'Very easy'},{l:'Km 3-4',ty:'main',d:'2km',pace:'5:40-5:50',hr:'<140',z:'Easy'},{l:'Km 5',ty:'rest',d:'4 × 20s strides',pace:'~4:25-4:30',n:'60-90s walk or jog back. Relaxed, never a sprint.'},{l:'Race-pace feel',ty:'cd',d:'60s',pace:'4:56',n:'Lock in the rhythm, then walk it off. Not in the DNE4.'}],desc:'<strong>Shakeout 5km - day before Cologne, 09:30.</strong><br><br>Km 1-2 very easy at 5:55-6:05 (HR under 135), km 3-4 easy at 5:40-5:50 (HR under 140), then 4 x 20s strides building to about 4:25-4:30 with 60-90s back, and one 60s at 4:56 to lock in race rhythm. Innerer Grüngürtel by the Colonius. Race socks, shorts and vest, not the DNE4.<br><br>Full plan: <strong>Races &gt; Race day</strong>.<br><br><strong>TOTAL: 5km.</strong>'},
    {id:'race',day:'Sun',t:'MARATHON',c:'tx',rpe:null,flex:false,club:false,
     km:42.2,min:210,ctx:'COLOGNE MARATHON. Target 3:25-3:30, NEGATIVE SPLIT. <strong>RUN WITH THE 3:30 PACE GROUP TO 25K.</strong> Then decide. <strong>DO NOT follow the 3:15 group.</strong> 3:15 is 4:37/km, which is your THRESHOLD pace - your 13 Aug session was 4x10min at 4:36/4:25/4:21/4:21. Threshold is a one-hour pace. Following them means holding it for 195 minutes. You will feel superb to 21km and finish in 3:45-4:05. The choice is not 3:15 versus 3:26, it is 3:26 versus 3:50.',shoes:'<strong>DNE4.</strong> Fifth and final outing. Nothing new: same socks, same shorts, same vest, same cap as the Nocturna.',fuel:'<strong>Breakfast 07:15-07:45:</strong> 2 white bagels with honey or jam (no butter), banana, coffee. About 120g carbs, exactly as rehearsed.<br><br><strong>Caffeine, three doses and nothing else:</strong> one coffee with breakfast, half a Monster (250ml) at 08:30 at the flat, a Maurten CAF 100 at km 31 from your pocket. About 280mg. No second coffee and no caffeine gel in the pen. Banana at 09:45.<br><br><strong>Immodium: skip it.</strong> You have never needed to stop on a run. Two tablets stay at the flat for a genuine emergency only.<br><br><strong>On the run:</strong> plain Maurten 100 in the start pen, then 5 x Beta Fuel at km 7, 14, 21.5, 28 and 34, plus one Maurten CAF 100 at km 31. Every gel after km 7 goes straight after a drinks station: sips first, gel 100-200m later. About 65g carbs an hour. Carry four Beta Fuel, the CAF 100 and a spare Maurten 100; the crew hands over 2 Beta Fuel (km 34 plus a spare) and 1 spare CAF 100 on Piusstraße at km 26.3 (second chance km 27.3). Water 100-150ml (half a cup) at each station, more only if thirsty.<br><br><strong>Sodium:</strong> 2 SiS Hydro in 500ml at 06:45, 1 in the start bottle, none during the race. Full timeline, race plan and fuelling: <strong>Races &gt; Race day</strong>.',steps:[{l:'Race',ty:'main',d:'42.2km',pace:'5:02, 4:58, then 4:56, 4:50 from km 30 if earned',hr:'150-162 to 25k',z:'MP',n:'PACER RULES: run at the EDGE of the 3:30 group, never buried in it (they surge at drink stations). Check at the expo whether they run gun or chip time. If they take 10k quicker than 49:30 they are banking time - let them go and run your own 4:57. Your watch is the authority, not the balloon. Leaving them at 25K because you feel strong is the plan working. HR GATES (max ~196): km 2-5 = 145-152, km 5-15 = 150-157, km 15-25 = 155-162, km 25-32 = 160-167, km 32+ = no ceiling. ABORT if above 162 before halfway at 4:57 - ease to 5:02, gel, reassess at 25K. GREEN LIGHT if 21km comes up at 4:57 with HR 152-155. Ignore the first 2km reading entirely. Wear the chest strap. Km 0-5: settle, 4:58-5:00 - let the 4:45 heroes go. Km 5-21: lock 4:56-4:58 by the 5k markers (24:50-25:00 each), HR 160-168, halfway 1:44:30-1:45:00. Km 21-30: hold 4:55-4:57 as it becomes work - stay asleep, no attacking. Km 30: decision gate. Strong = wind to 4:50-4:52 and hunt. Neutral = hold. Struggling = defend at 5:00, sub-3:30 still lives. Km 37+: empty it. Run tangents all day - the watch reads ~42.5km, so official sub-3:30 needs watch average ~4:56.'}],desc:'<strong>COLOGNE MARATHON - target 3:25-3:30, negative split.</strong><br><br><strong>PACER: go with the 3:30 group to 25K.</strong> It costs nothing and buys a free option - arrive at 25K on 4:58 and you hold a live shot at 3:26 if you feel good, and a guaranteed 3:30 if you do not.<br><br><strong>NOT the 3:15 group.</strong> 3:15 is 4:37/km = your threshold pace (13 Aug: 4x10min at 4:36-4:21). Threshold lasts an hour, not 195 minutes. It will feel easy at 10km, easy at 15km, then take you apart at 30km. Expected result 3:45-4:05.<br><br><strong>25K maths:</strong> through in 2:04:10, then the last 17.2km at 4:59 = 3:30 &middot; at 4:52 = 3:28 &middot; at 4:45 = 3:26 &middot; at 4:38 = 3:24.<br><br><strong>HEART RATE GATES (HRmax ~196):</strong><br>Km 0-2: ignore the reading - adrenaline and congestion.<br>Km 2-5: <strong>145-152</strong>. Above 155 here = gone off too hard.<br>Km 5-15: <strong>150-157</strong>. This is where you should live.<br>Km 15-25: <strong>155-162</strong>. Upward drift is normal.<br>Km 25-32: 160-167. Km 32+: no ceiling.<br><br><strong>ABORT SIGNAL: above 162 before halfway at 4:57.</strong> Means heat, under-fuelling or poor recovery. Response is the same for all three - ease to 5:02, take a gel, reassess at 25K. Sub-3:30 survives that. It does not survive ignoring it.<br><strong>GREEN LIGHT: through 21km at 4:57 with HR 152-155.</strong> That profile ends in 3:24.<br><br><strong>Cardiac drift is normal</strong> - HR climbs 8-12 beats from km 5 to km 30 at correct pace. Only act if it drifts up AND crosses 162 before halfway.<br><strong>Wear the chest strap.</strong> Optical HR is worst in the first 10min and in cold air, exactly when you are making pacing decisions.<br><strong>Pace leads to 25K, HR is the warning light. After 25K they swap.</strong><br><br><strong>Km 0-5:</strong> settle, 4:58-5:00, HR 145-152. Let the heroes go.<br><strong>Km 5-21:</strong> lock 4:56-4:58 by the 5k marker clocks (24:50-25:00 per 5k). Halfway 1:44:30-1:45:00.<br><strong>Km 25 - leave the group?</strong> Comfortable = ease to 4:50-4:53 and go. Not comfortable = stay with them, 3:30 is still a very good debut.<br><strong>Km 21-30:</strong> hold 4:55-4:57. It becomes work here - stay asleep, no attacking. This stretch is where debuts are lost, not at 35k.<br><strong>Km 30 - decision gate:</strong> strong = attack 4:50-4:52 and hunt the fading field. Neutral = hold 4:57. Struggling = defend 5:00, sub-3:30 still lives.<br><strong>Km 37-42:</strong> empty it.<br><strong>Checkpoints (official clock):</strong> 10k 49:40-50:00 · half 1:44:30-1:45:00 · 30k 2:28:30-2:29:30.<br><strong>FUEL:</strong> 5 x Beta Fuel at km 7, 14, 21.5, 28, 34, plus a Maurten CAF 100 at km 31, each straight after a station from km 14. Crew handoff on Piusstraße at km 26.3 / 27.3. Water at most stations.<br><strong>Tangents:</strong> watch reads ~42.5km - official 3:30 needs watch avg ~4:56. Shortest line, all day.<br><br>Trust the work.'}
   ]},
 ]},

// Autumn block: Köln recovery, Gandia Half build, 10K block to Pas Ras and Ibercaja
var plan10k = [{"phase": "a-recover", "label": "Autumn - Recovery (Oct 5-18)", "cls": "base", "pnote": "Two weeks of nothing that matters. A marathon costs more than it feels like at the time, and the most common way to ruin a good autumn is to start training again in week one because the legs felt fine. They are lying. Winter Arc gym re-entry at light loads, body-fat baseline measured, no running structure at all.", "weeks": [{"id": "k1", "wk": "Autumn W1 (Oct 5-11) - RECOVERY", "vol": "15km", "tag": "RECOVERY", "note": "Nothing is gained this week and plenty can be lost. You have just raced a marathon. No structure, no pace, no gym beyond light movement. Gandia is 8 Nov at 4:28-4:30: nothing this week can improve that number, but running too soon can cost it. Book the DEXA or caliper measurement for the Winter Arc baseline.", "sessions": [{"id": "mon", "day": "Mon", "t": "Full rest", "c": "tr2", "rpe": "1", "flex": false, "club": false, "km": 0, "min": 0, "ctx": "Complete rest. Walk if you like.", "steps": [{"l": "Rest", "ty": "cd", "d": "Rest", "n": "Nothing. Eat, sleep, celebrate."}], "desc": "Full rest."}, {"id": "wed", "day": "Wed", "t": "Walk or jog", "c": "tr2", "rpe": "1", "flex": false, "club": false, "km": 0, "min": 0, "ctx": "Optional. A 20-30min walk, or the gentlest jog if the legs are genuinely fine. Stop the moment it feels like training.", "steps": [{"l": "Optional", "ty": "main", "d": "20-30min", "n": "Walk or very easy jog. No watch pressure."}], "desc": "Optional 20-30min walk or very easy jog."}, {"id": "sat", "day": "Sat", "t": "Easy", "c": "te", "rpe": "2", "flex": false, "club": false, "km": 6, "min": 36, "ctx": "Only if you want to. Nothing under 6:00/km.", "steps": [{"l": "Main set", "ty": "main", "d": "6km", "pace": "6:00+", "hr": "<135", "z": "Very easy"}], "desc": "6km very easy at 6:00+/km. Optional."}, {"id": "sun", "day": "Sun", "t": "Easy", "c": "te", "rpe": "2", "flex": false, "club": false, "km": 9, "min": 54, "ctx": "First run tha   for (var i = 0; i < line.length; i++){
    var c = line[i];
    if (q){ if (c === '"'){ if (line[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true; else if (c === ',') { out.push(cur); cur = ''; } else cur += c;
  }
  out.push(cur); return out;
}
var RUNS = [];
(function(){
  var lines = CSV_DATA.trim().split('\n'), head = parseCSVLine(lines[0]);
  var seen = {};
  for (var i = 1; i < lines.length; i++){
    if (!lines[i].trim()) continue;
    var v = parseCSVLine(lines[i]); if (v.length === 36) v.splice(32, 0, '', '', '');
    var r = {}; head.forEach(function(h, j){ r[h] = (v[j] || '').trim(); });
    var type = r['Tipo de actividad'];
    if (type !== 'Carrera' && type !== 'Entrenamiento en pista' && type !== 'Entrenamiento en cinta') continue;
    var dist = num(r['Distancia']); if (dist == null) continue;
    if (type === 'Entrenamiento en pista' && dist > 100) dist /= 1000;
    var secs = toSecs(r['Tiempo']); if (!secs) continue;
    var ds = r['Fecha'].slice(0, 10), key = ds + '|' + dist.toFixed(1);
    if (seen[key]) continue; seen[key] = 1;
    RUNS.push({ds: ds, at: r['Fecha'], title: r['Título'] || 'Run', dist: dist, secs: secs,
      hr: num(r['Frecuencia cardiaca media']), pace: /^\d+:\d\d$/.test(r['Ritmo medio'] || '') ? r['Ritmo medio'] : null, mhr: num(r['FC máxima']), climb: num(r['Ascenso total'])});
  }
  RUNS.sort(function(a, b){ return a.at < b.at ? 1 : -1; });
})();
function kind(t){
  if (/^Race/i.test(t)) return 'race';
  if (/^(Intervals|Tempo|Threshold|Progress|Fartlek|Hill)/i.test(t) || /\b(T-pace|tempo|threshold|fartlek|series)\b/i.test(t)) return 'quality';
  if (/^Long/i.test(t)) return 'long';
  return 'easy';
}

function cleanTitle(t){ return t.replace(/^(Race|Easy Run|Long Run|Recovery Run|Intervals|Tempo Run|Moderate Run)\s*[–-]\s*/i, function(m){ return /^Race/i.test(m) ? '' : m; }).replace(/[\u{1F300}-\u{1FAFF}☀-➿‍️]/gu, '').trim(); }

function summary(s){
  if (s.sum) return s.sum;
  if (s._gym) return 'Gym session';
  var main = (s.steps || []).filter(function(x){ return x.ty === 'main'; });
  var bits = main.map(function(x){ return x.d + (x.pace ? ' at ' + x.pace : ''); });
  if ((s.steps || []).some(function(x){ return x.l === 'Strides'; })) bits.push('strides');
  return bits.join(', ') || (s.ctx || '').split('. ')[0];
}
function gymName(s){ return s.t.replace(/^Gym\s*·?\s*/, '') || 'Gym'; }

function sessRow(s, showDate, idx){
  var d = s._date, isToday = d === TODAY, past = d < TODAY;
  var done = kmOn(d), right = '';
  if (s._gym) right = '';
  else if (s.km) right = (past || isToday) && done ? '<span class="tick">✓ ' + km1(done) + ' km</span>' : s.km + ' km';
  else right = '';
  var cls = 'row' + (isToday ? ' today' : '') + (past ? ' past' : '') + (s._gym ? ' gymrow' : '');
  var dt = new Date(dOf(d));
  var dateCol = showDate ? '<div class="d">' + WD[dt.getDay()] + '<b>' + dt.getDate() + '</b></div>' : '<div class="d"></div>';
  var title = s._gym ? '🏋️ ' + esc(gymName(s)) : esc(s.t);
  return '<button class="' + cls + '" data-sess="' + idx + '">' + dateCol +
    '<span class="dot ' + (s._gym ? 'gym' : s.c) + '"></span>' +
    '<div class="m"><div class="t">' + title + '</div><div class="s">' + esc(summary(s)) + '</div></div>' +
    '<div class="r">' + right + '</div></button>';
}
var SESS_REG = [];

function daysRows(fromDs, n){
  var html = '';
  for (var i = 0; i < n; i++){
    var d = addDays(fromDs, i), list = SESS_BY_DATE[d] || [];
    if (!list.length){
      var dt = dOf(d);
      html += '<div class="row' + (d === TODAY ? ' today' : '') + (d < TODAY ? ' past' : '') + '"><div class="d">' + WD[dt.getDay()] + '<b>' + dt.getDate() + '</b></div><span class="dot"></span><div class="m"><div class="t muted">Rest</div></div></div>';
      continue;
    }
    list.forEach(function(s, j){ html += sessRow(s, j === 0, reg(s)); });
  }

function planWeek(w, i, now){
  var lines = ['Easy running back in, one taste of race pace, then Bilbao.', 'Wednesday\'s test sets your race pace. Last long run Sunday.', 'Less running, more rest. One sharpener, then race.'];
  var rows = '';
  for (var k = 0; k < 7; k++){
    var d = addDays(w.start, k), dt = dOf(d);
    var list = (SESS_BY_DATE[d] || []).filter(function(s){ return s._week === w; });
    var runs = list.filter(function(s){ return !s._gym; }), gyms = list.filter(function(s){ return s._gym; });
    var main = runs[0] || gyms[0], cls = 'pd', right = '', gtag = '';
    if (!main){ rows += '<div class="pd rest"><div class="d">' + WD[dt.getDay()] + ' ' + dt.getDate() + '</div><span class="dot"></span><div class="m"><div class="t">Rest</div></div></div>'; continue; }
    var isRest = !main._gym && !main.km;
    if (main._gym) cls += ' gymonly'; else if (isRest) cls += ' rest'; else if (main.c !== 'te') cls += ' key';
    if (d === TODAY) cls += ' today'; else if (d < TODAY) cls += ' past';
    if (main.km){ var done = kmOn(d); right = d <= TODAY && done ? '<span class="tick">✓ ' + km1(done) + '</span>' : main.km + ' km'; }
    var extra = runs.slice(1).concat(main._gym ? gyms.slice(1) : gyms);
    gtag = extra.map(function(s){ return '<span class="g" data-sess="' + reg(s) + '">' + (s._gym ? '+ Gym: ' + esc(gymName(s)) : '+ ' + esc(s.t)) + '</span>'; }).join('');
    var title = main._gym ? 'Gym: ' + esc(gymName(main)) : esc(main.t.replace(/\s+-\s+rest$/i, ', rest'));
    rows += '<div class="' + cls + '" data-sess="' + reg(main) + '"><div class="d">' + WD[dt.getDay()] + ' ' + dt.getDate() + '</div><span class="dot ' + (main._gym ? 'gym' : main.c) + '"></span><div class="m"><div class="t">' + title + '</div>' + gtag + '</div><div class="r">' + right + '</div></div>';
  }
  return '<div class="wk' + (now ? ' now' : '') + '"><div class="wk-h"><div class="n">Week ' + (i + 1) + ' · ' + fmtDay(w.start).slice(4) + ' - ' + fmtDay(addDays(w.start, 6)).slice(4) + ' · ' + w.km + ' km</div><div class="t">' + esc(w.title) + '</div><div class="s">' + lines[i] + '</div></div>' + rows + '</div>';
}
function weekRows(w){

}

var veil = document.getElementById('veil'), sheet = document.getElementById('sheet');
function openSheet(html){ sheet.innerHTML = '<button class="sheet-x" aria-label="Close">✕</button>' + html; veil.classList.add('on'); sheet.scrollTop = 0; document.body.style.overflow = 'hidden'; }
function closeSheet(){ veil.classList.remove('on'); document.body.style.overflow = ''; }
veil.addEventListener('click', function(e){ if (e.target === veil || e.target.closest('.sheet-x')) closeSheet(); });

function stepsHtml(steps){
  return '<div class="steps">' + (steps || []).map(function(x){
    var v = esc(x.d || '') + (x.pace ? '<span class="p">' + esc(x.pace) + (/\d$/.test(x.pace) ? '/km' : '') + '</span>' : '');
    var meta = [x.hr ? 'HR ' + x.hr : '', x.z || ''].filter(Boolean).join(' · ');
    return '<div class="step ' + (x.ty || 'main') + '"><span class="bar2"></span><div><div class="l">' + esc(x.l) + (meta ? ' · ' + esc(meta) : '') + '</div>' +
      '<div class="v">' + v + '</div>' + (x.n ? '<div class="n">' + esc(x.n) + '</div>' : '') + '</div></div>';
  }).join('') + '</div>';
}
function sessSheet(s){
  var d = s._date, done = RUNS_BY_DATE[d] || [];
  var html = '<div class="kick">' + fmtDay(d) + ' · ' + esc(s._week.title) + '</div><h3>' + esc(s._gym ? gymName(s) : s.t) + '</h3>';
  if (s.km) html += '<span class="chip">' + s.km + ' km</span> ';
  if (done.length && !s._gym) html += '<span class="chip ok">✓ Done: ' + done.map(function(r){ return km1(r.dist) + ' km at ' + rp(r); }).join(', ') + '</span>';
  if (s.ctx) html += '<p style="margin-top:14px">' + esc(s.ctx) + '</p>';
  if (s._gym){
    var g = GYM.filter(function(x){ return gymName(s).toLowerCase().indexOf(x.name.toLowerCase()) === 0; })[0];
    html += stepsHtml(s.steps);
    html += '<button class="btn" data-go="gym">Open the Gym page →</button>';
  } else {
    html += stepsHtml(s.steps);
    if (!s.sum && s.desc && !(s.steps || []).length) html += '<p>' + s.desc + '</p>';
  }
  if (s.why) html += '<div class="why">' + esc(s.why) + '</div>';
  openSheet(html);
}

function lapsFor(r){
  var arr = LAPS_DATA[r.ds]; if (!arr) return null;
  if (!Array.isArray(arr)) arr = [arr];
  var best = null, diff = 1e9;
  arr.forEach(function(e){ var dd = Math.abs((e.dist_km || 0) - r.dist); if (dd < diff){ diff = dd; best = e; } });
  return diff < 1.5 ? best : null;
}
function runSheet(r){
  var html = '<div class="kick">' + fmtLong(r.ds) + '</div><h3>' + esc(cleanTitle(r.title) || 'Run') + '</h3>';
  html += '<div class="kv"><div><b>' + km1(r.dist) + '</b><span>km</span></div><div><b>' + hms(r.secs) + '</b><span>time</span></div><div><b>' + rp(r) + '</b><span>per km</span></div><div><b>' + (r.hr || '-') + '</b><span>avg HR</span></div></div>';
  if (RACE_NOTE[r.ds]) html += '<p>' + esc(RACE_NOTE[r.ds]) + '</p>';
  var club = (CLUB_SESSIONS[addDays(r.ds, -((dOf(r.ds).getDay() + 6) % 7))] || {})[WD[dOf(r.ds).getDay()].toLowerCase()];
  if (club && club.desc && kind(r.title) !== 'easy') html += '<p><b>The session:</b> ' + esc(club.desc) + '</p>';
  if (kind(r.title) === 'quality' && repSummary(r)) html += '<p><b>Reps:</b> ' + repSummary(r) + '</p>';
  var L = lapsFor(r);
  if (L){
    var blocks = (L.blocks || []).filter(function(b){ return b.t === 'work'; }).length ? L.blocks : null;
    var rows = blocks || (L.laps || []).filter(function(l){ return l.dist >= 0.05; });
    if (!blocks && rows.length >= 12){
      var half = Math.floor(rows.length / 2), a = 0, ad = 0, b = 0, bd = 0;
      rows.forEach(function(l, i){ if (i < half){ a += l.time; ad += l.dist; } else { b += l.time; bd += l.dist; } });
      html += '<p><b>First half</b> ' + paceOf(a, ad) + '/km · <b>second half</b> ' + paceOf(b, bd) + '/km' + (b / bd < a / ad ? ' (negative split)' : '') + '</p>';
    }
    var secsArr = rows.map(function(l){ return l.dist ? l.time / l.dist : 0; }).filter(Boolean);
    var fast = Math.min.apply(null, secsArr), slow = Math.max.apply(null, secsArr);
    var LBL = {work:'Rep', rec:'Recovery', wu:'Warm-up', cd:'Cool-down', steady:'Steady'};
    var repN = 0;
    html += '<table class="sp"><tr><th>' + (blocks ? 'Block' : 'Km') + '</th><th>Dist</th><th>Pace</th><th>HR</th><th></th></tr>' + rows.map(function(l, i){
      var name = blocks ? (l.t === 'work' ? 'Rep ' + (++repN) : (LBL[l.t] || l.t)) : (i + 1);
      var ps = l.dist ? l.time / l.dist : 0, w = slow > fast ? Math.min(100, Math.max(6, 20 + 80 * (slow - ps) / (slow - fast))) : 60;
      return '<tr><td>' + name + '</td><td>' + km1(l.dist) + '</td><td>' + (l.pace || paceOf(l.time, l.dist)) + '</td><td>' + (l.hr ? Math.round(l.hr) : '-') + '</td><td style="width:30%"><span class="spbar" style="width:' + Math.round(w) + '%"></span></td></tr>';
    }).join('') + '</table>';
  } else html += '<p class="muted">No split data for this run.</p>';
  openSheet(html);
}

var NOTES = [
 {q:'Is 1:35 realistic?', a:'Yes, and it is the right number to start from', body:
  '<p><b>Short answer: yes.</b> 1:35 is 4:30/km. Your 10K PB (41:12) says you could run about 1:31 if you were fully trained for a half, and a year ago you held 4:29/km for 15K at the Nocturna. The marathon (3:41) says 1:46, but marathons go wrong in ways a half does not: fuel, the last 10km, the heat of pacing for 42km.</p>' +
  '<p><b>Why not aim faster from day one?</b> Two quiet weeks and a trip to Bilbao sit inside these three weeks. 1:35 is a time you can run on a normal day, which means you can race the last 5km instead of surviving them.</p>' +
  '<p><b>How you find out if there is more:</b> the race-pace test on Wednesday 28 Oct. If 3 x 3km at 4:30 feels comfortable and your heart rate stays at 172 or below on rep 3, you go for 1:33-1:34. That is how you run the quickest you can without blowing up like Köln.</p>'},
 {q:'Have I lost my marathon fitness?', a:'Barely, and it comes back fast', body:
  '<p><b>Mostly no.</b> Two easy weeks after a marathon is what any coach would prescribe anyway; you just ran less than planned. Here is what actually happens in a fortnight of low running:</p>' +
  '<p><b>Blood volume drops a little.</b> That is why your first runs back will feel heavy and your heart rate will sit 5-10 beats higher. It returns within 7-10 days of regular running.</p>' +
  '<p><b>Your engine barely moves.</b> VO2max falls only a few percent in two weeks, and the aerobic base from 897km since June does not disappear. The gym work helps hold it.</p>' +
  '<p><b>What fades first is marathon-specific endurance</b> (the 30km-plus stuff), and a half needs much less of that. Run four or five times a week from Monday and you will be at least as fit for 21km on 8 November as you were in September.</p>'},

function go(page, push){
  if (page === 'plan'){ page = 'runs'; RUNS_TAB = 'plan'; renderRunsLeft(); setTimeout(function(){ var t = document.querySelector('.rtabs'); if (t) t.scrollIntoView(); }, 0); }
  if (!document.getElementById('pg-' + page)) page = 'today';
  document.querySelectorAll('.page').forEach(function(p){ p.classList.toggle('on', p.id === 'pg-' + page); });
  document.querySelectorAll('[data-go]').forEach(function(b){ if (b.closest('#sidenav,#bar')) b.classList.toggle('on', b.dataset.go === page); });
  if (push !== false) history.replaceState(null, '', '#' + page);
  try { localStorage.setItem('rd_page', page); } catch(e) {}
  window.scrollTo(0, 0);
}
