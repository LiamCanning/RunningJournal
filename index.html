<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF6EE">
<title>Liam's Running Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF6EE; --cream:#F0E7D5; --card:#FFFDF8; --ink:#1A1410; --ink2:#3D342C; --dust:#7A6E60;
  --rule:#E6DCCB; --carmin:#C4202E; --carmin-soft:#F6E1DF; --sienna:#6B3410; --terra:#A0522D;
  --ochre:#D4943A; --oliva:#708238; --anil:#2B4C7E;
  --easy:#708238; --quality:#C4202E; --long:#2B4C7E; --race:#D4943A; --gym:#6B3410; --rest:#B5A894;
  --serif:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,-apple-system,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
  background-image:radial-gradient(ellipse at 85% 0%,rgba(212,148,58,.10),transparent 55%),radial-gradient(ellipse at 0% 100%,rgba(196,32,46,.05),transparent 50%);
  background-attachment:fixed;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
a{color:var(--carmin)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--rule);background:rgba(250,246,238,.7);padding:28px 14px;display:flex;flex-direction:column}
.brand{padding:0 12px 24px;border-bottom:1px solid var(--rule);margin-bottom:18px}
.brand-k{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dust);font-weight:600}
.brand-t{font-family:var(--serif);font-size:27px;line-height:1.05;font-weight:700;margin-top:6px}
.nav-a{display:flex;align-items:center;gap:14px;width:100%;padding:13px 16px;border-radius:14px;font-size:16px;font-weight:600;color:var(--ink2);margin-bottom:4px;transition:background .15s}
.nav-a:hover{background:var(--cream)}
.nav-a .e{font-size:20px;width:24px;text-align:center}
.nav-a.on{background:var(--carmin);color:#fff;box-shadow:0 6px 18px rgba(196,32,46,.22)}
.side-foot{margin-top:auto;padding:16px 12px 0;border-top:1px solid var(--rule);font-size:13px;color:var(--dust)}
.side-race{display:block;width:100%;padding:14px;border-radius:14px;background:var(--cream);margin-bottom:14px}
.side-race b{font-family:var(--serif);font-size:19px;display:block;color:var(--ink)}
main{padding:44px 56px 120px;max-width:1040px;width:100%}
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:0 64px}
.split>.col{display:contents}
.o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}.o5{order:5}
.o1>.card{margin-top:40px}.o2{margin-top:40px}
.bar{display:none}

/* ---------- type ---------- */
.kick{font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--dust)}
.kick .acc{color:var(--carmin)}
h1{font-family:var(--serif);font-weight:800;font-size:64px;line-height:1;letter-spacing:-.01em;margin:10px 0 6px;color:var(--ink)}
.lede{font-size:17px;color:var(--ink2);max-width:640px}
.sec{display:flex;align-items:baseline;gap:14px;margin:52px 0 18px}
.sec h2{font-family:var(--serif);font-size:28px;font-weight:700;white-space:nowrap}
.sec .ln{flex:1;height:1px;background:var(--rule)}
.sec .meta{font-family:var(--mono);font-size:13.5px;color:var(--dust);white-space:nowrap}
.muted{color:var(--dust)}
.mono{font-family:var(--mono)}
.page{display:none;animation:fadeUp .35s ease both}
.page.on{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rule-grad{height:2px;background:linear-gradient(90deg,var(--carmin),var(--ochre) 60%,transparent);margin:56px 0 0;border:0;opacity:.7}

/* ---------- hero ---------- */
.hero{display:flex;align-items:center;gap:24px;background:var(--carmin);color:#fff;border-radius:24px;padding:28px 32px;margin-top:28px;width:100%;box-shadow:0 14px 34px rgba(196,32,46,.22);transition:transform .2s}
.hero:hover{transform:translateY(-3px)}
.hero .kick{color:rgba(255,255,255,.75)}
.hero-t{font-family:var(--serif);font-size:40px;font-weight:800;line-height:1.05;margin:6px 0 8px}
.hero-s{font-size:16px;opacity:.92}
.hero-n{margin-left:auto;text-align:center;flex-shrink:0;padding-left:24px;border-left:1px solid rgba(255,255,255,.3)}
.hero-n b{display:block;font-family:var(--serif);font-size:64px;line-height:1;font-weight:800}
.hero-n span{font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.hero-strip{display:flex;gap:6px;margin-top:16px}
.hero-strip i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.28)}
.hero-strip i.done{background:#fff}
.hero-strip i.now{background:var(--ochre)}

/* ---------- cards / rows ---------- */
.two{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:40px}
.card{align-self:start;background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:26px;box-shadow:0 2px 0 rgba(26,20,16,.03)}
.today-t{font-family:var(--serif);font-size:32px;font-weight:700;line-height:1.1;margin:8px 0 6px}
.today-s{font-size:16px;color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--cream);color:var(--ink2)}
.chip.ok{background:#E7EDD8;color:#4A5A1E}
.chip.red{background:var(--carmin-soft);color:var(--carmin)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:12px;background:var(--ink);color:#fff;font-weight:600;font-size:15px;margin-top:18px}
.btn.soft{background:var(--cream);color:var(--ink)}
.list{border-top:1px solid var(--rule)}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:15px 2px;border-bottom:1px solid var(--rule);transition:background .15s}
button.row:hover{background:rgba(240,231,213,.45)}
.row .d{width:64px;flex-shrink:0;font-size:13.5px;color:var(--dust);font-weight:600;line-height:1.25}
.row .d b{display:block;font-family:var(--serif);font-size:21px;color:var(--ink);font-weight:700}
.row .m{flex:1;min-width:0}
.row .t{font-family:var(--serif);font-size:18.5px;font-weight:700;line-height:1.25}
.row .s{font-size:14px;color:var(--dust);margin-top:2px}
.row .r{font-family:var(--mono);font-size:14.5px;color:var(--ink2);text-align:right;white-space:nowrap}
.row .r small{display:block;font-size:12.5px;color:var(--dust)}
.row.today{background:rgba(196,32,46,.05);box-shadow:inset 3px 0 0 var(--carmin);padding-left:14px;margin-left:-12px;width:calc(100% + 12px)}
.row.past{opacity:.62}
.row.gymrow .t{font-family:var(--sans);font-size:15.5px;font-weight:600;color:var(--gym)}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:var(--rest)}
.dot.te{background:var(--easy)} .dot.tq{background:var(--quality)} .dot.tl{background:var(--long)} .dot.tx{background:var(--race)} .dot.gym{background:var(--gym)}
.tick{color:var(--oliva);font-weight:700}
.miss{color:var(--dust)}

/* ---------- paces ---------- */
.paces{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.pace{padding:22px 18px;border-right:1px solid var(--rule)}
.pace:last-child{border-right:0}
.pace .l{font-size:13px;font-weight:600;color:var(--dust);display:flex;align-items:center;gap:8px}
.pace .v{font-family:var(--serif);font-size:34px;font-weight:800;line-height:1.1;margin:6px 0 2px;color:var(--ink)}
.pace .v small{font-size:15px;font-family:var(--sans);font-weight:500;color:var(--dust)}
.pace .h{font-size:13.5px;color:var(--ink2)}
.pace.goal .v{color:var(--carmin)}

/* ---------- qa ---------- */
.qa{display:flex;align-items:center;gap:16px;width:100%;padding:18px 2px;border-bottom:1px solid var(--rule)}
.qa:hover .q{color:var(--carmin)}
.qa .q{font-family:var(--serif);font-size:20px;font-weight:700;flex:1;transition:color .15s}
.qa .a{font-size:14px;color:var(--dust)}
.arrow{font-size:20px;color:var(--dust)}

/* ---------- plan ---------- */
.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-top:30px}
.ph{padding:20px 20px 20px 0}
.ph+.ph{padding-left:20px;border-left:1px solid var(--rule)}
.ph .n{font-family:var(--serif);font-size:15px;color:var(--carmin);font-weight:700}
.ph .t{font-family:var(--serif);font-size:24px;font-weight:700;margin:2px 0 4px}
.ph .s{font-size:14.5px;color:var(--ink2)}
.ph.now .t{color:var(--carmin)}
.weeks{display:grid;grid-template-columns:minmax(0,1fr);gap:48px;margin-top:36px}
.wk-h{padding-bottom:16px;border-bottom:2px solid var(--ink)}
.wk-h .n{font-family:var(--mono);font-size:13px;color:var(--dust)}
.wk-h .t{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1.15;margin:6px 0 8px}
.wk.now .wk-h .t{color:var(--carmin)}
.wk-h .s{font-size:15.5px;line-height:1.5;color:var(--ink2)}
.pd{display:flex;align-items:center;gap:14px;padding:15px 4px;border-bottom:1px solid var(--rule);cursor:pointer;transition:background .15s}
.pd:hover{background:rgba(240,231,213,.45)}
.pd .d{width:62px;flex-shrink:0;font-size:14px;font-weight:600;color:var(--dust)}
.pd .m{flex:1;min-width:0}
.pd .t{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.25}
.pd.key .t{font-weight:800}
.pd.rest .t{font-family:var(--sans);font-size:15.5px;font-weight:500;color:var(--dust)}
.pd.gymonly .t{font-family:var(--sans);font-size:15.5px;font-weight:600;color:var(--gym)}
.pd .g{display:block;margin-top:3px;font-size:13.5px;font-weight:600;color:var(--gym)}
.pd .r{font-family:var(--mono);font-size:15px;color:var(--ink2);white-space:nowrap}
.pd.today{background:rgba(196,32,46,.05);box-shadow:inset 3px 0 0 var(--carmin);padding-left:16px;margin-left:-12px}
.pd.past{opacity:.6}
@media (min-width:1100px){.weeks{grid-template-columns:repeat(3,minmax(0,1fr));gap:44px}}
.wknote{font-size:15.5px;color:var(--ink2);margin:-4px 0 14px;max-width:720px}

/* ---------- race plan ---------- */
.rp{margin-top:6px}
.rp-bar{display:flex;height:54px;border-radius:14px;overflow:hidden}
.rp-bar div{display:flex;flex-direction:column;justify-content:center;padding:0 14px;color:#fff;font-size:13px;line-height:1.2}
.rp-bar b{font-family:var(--mono);font-size:16px}
.rp-marks{display:flex;justify-content:space-between;margin-top:10px;font-family:var(--mono);font-size:13px;color:var(--dust)}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:24px;border-top:1px solid var(--rule)}
.pl{padding:18px 18px 18px 0;border-bottom:1px solid var(--rule)}
.pl+.pl{padding-left:18px;border-left:1px solid var(--rule)}
.pl .n{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dust)}
.pl .v{font-family:var(--serif);font-size:30px;font-weight:800;margin:4px 0}
.pl .s{font-size:14px;color:var(--ink2)}
.pl.main .v{color:var(--carmin)}

/* ---------- gym ---------- */
.rules{counter-reset:r;border-top:1px solid var(--rule)}
.rule{display:flex;gap:18px;padding:16px 0;border-bottom:1px solid var(--rule)}
.rule:before{counter-increment:r;content:counter(r);font-family:var(--serif);font-size:26px;font-weight:800;color:var(--carmin);width:28px;flex-shrink:0;line-height:1.1}
.rule p{font-size:15.5px;color:var(--ink2)}
.rule b{color:var(--ink)}
.answer{font-family:var(--serif);font-size:26px;font-weight:700;line-height:1.25;margin:4px 0 20px;max-width:760px}
.answer em{color:var(--carmin);font-style:normal}
.week7{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.wd{border-radius:14px;padding:12px 10px;background:var(--cream);min-height:84px}
.wd .n{font-size:12.5px;font-weight:700;color:var(--dust);letter-spacing:.06em;text-transform:uppercase}
.wd .t{font-family:var(--serif);font-size:16px;font-weight:700;line-height:1.2;margin-top:6px}
.wd.g{background:var(--gym);color:#fff}
.wd.g .n{color:rgba(255,255,255,.7)}
.sess-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:22px;row-gap:0;align-items:stretch}
/* subgrid: every exercise row lines up across the three cards */
.sess{display:grid;grid-template-rows:subgrid;grid-row:span 10;row-gap:0;background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:22px 22px 12px}
.sess-top{padding-bottom:14px}
.sess-top .day{font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--carmin)}
.sess-t{font-family:var(--serif);font-size:28px;font-weight:800;line-height:1.1;margin:4px 0 2px}
.sess-f{font-size:14px;color:var(--dust)}
.ex{display:flex;flex-direction:column;width:100%;padding:14px 0;border-top:1px solid var(--rule);transition:background .15s}
.ex:hover .ex-n{color:var(--carmin)}
.ex-pics{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.ex-pics figure{margin:0;background:#fff;border-radius:10px;overflow:hidden;border:1px solid var(--rule)}
.ex-pics img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.ex-pics.big{gap:10px;margin:18px 0 14px}
.ex-pics.big img{aspect-ratio:auto;object-fit:contain}
.ex-pics figcaption{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dust);padding:6px 10px;background:var(--card)}
.ex-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ex-n{font-weight:600;font-size:15.5px;line-height:1.3;transition:color .15s}
.ex-r{font-family:var(--mono);font-size:14px;font-weight:600;white-space:nowrap}
.ex-c{font-size:13.5px;color:var(--dust);margin-top:3px;line-height:1.45}
.heavy{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--carmin);border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:2px}
.abs-h{align-self:end;font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--sienna);padding:18px 0 4px;border-top:2px solid var(--rule)}
.abs-h+.ex{border-top:0}
.nums{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.num{padding:20px 18px;border-right:1px solid var(--rule)}
.num:last-child{border-right:0}
.num .v{font-family:var(--serif);font-size:32px;font-weight:800;line-height:1.1}
.num .l{font-size:13px;font-weight:600;color:var(--dust)}
.num .s{font-size:13.5px;color:var(--ink2);margin-top:4px}

/* ---------- runs ---------- */
.runs-nums{margin-top:28px}
.lnk{color:var(--carmin);font-weight:600}
.wc{position:relative;margin-top:34px;background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:26px 28px 20px}
.wc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
.wc-big{font-family:var(--serif);font-size:44px;font-weight:800;line-height:1.05;margin-top:6px}
.wc-big small{font-family:var(--sans);font-size:16px;font-weight:500;color:var(--dust)}
.wc-sub{font-size:14.5px;color:var(--ink2);margin-top:4px}
.seg{display:inline-flex;background:var(--cream);border-radius:12px;padding:4px}
.seg button{padding:8px 14px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(26,20,16,.12)}
.wc-plot{position:relative;height:300px;margin:30px 0 0 28px}
.wc-g{position:absolute;left:0;right:0;border-top:1px dashed var(--rule)}
.wc-g span{position:absolute;left:-30px;top:-9px;width:24px;text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--dust)}
.wc-bars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:6px;border-bottom:1px solid var(--ink2)}
.dense .wc-bars{gap:3px}
.wb{position:relative;flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;border-radius:6px 6px 0 0}
.wb:hover{background:rgba(240,231,213,.6)}
.wb-s{position:relative;width:100%;max-width:46px;display:flex;flex-direction:column;border-radius:5px 5px 0 0;overflow:visible;min-height:2px;transition:height .4s}
.wb-s i{display:block;width:100%;min-height:2px}
.wb-s i:first-of-type{border-radius:5px 5px 0 0}
.wb-s em{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);padding-bottom:4px;font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--ink2);white-space:nowrap}
.wb:not(:hover):not(.cur) .wb-s i{opacity:.82}
.wb-plan{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:46px;border:2px dashed var(--carmin);border-bottom:0;border-radius:5px 5px 0 0}
.wb.cur .wb-s{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--carmin)}
.wb-x{position:absolute;top:100%;left:50%;transform:translateX(-50%);padding-top:8px;font-family:var(--mono);font-size:11.5px;color:var(--dust);white-space:nowrap}
.k-easy{background:var(--easy)} .k-quality{background:var(--quality)} .k-long{background:var(--long)} .k-race{background:var(--race)}
.k-plan{border:2px dashed var(--carmin);background:transparent!important}
.wc-key{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:40px;font-size:13.5px;color:var(--ink2)}
.wc-key span,.tip-k span{display:inline-flex;align-items:center;gap:6px}
.wc-key i,.tip-k i{display:inline-block;width:10px;height:10px;border-radius:3px}
.wc-key .muted{margin-left:auto}
.wc-tip{position:absolute;z-index:5;pointer-events:none;background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;font-size:13.5px;min-width:170px;opacity:0;transition:opacity .12s}
.wc-tip.on{opacity:1}
.wc-tip .kick{color:rgba(255,255,255,.65);font-size:11.5px}
.wc-tip b{display:block;font-family:var(--serif);font-size:24px;margin:2px 0}
.tip-k{display:flex;flex-direction:column;gap:2px;margin-top:6px;color:rgba(255,255,255,.85)}
.runs-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 56px;align-items:start}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.filters button{padding:8px 14px;border-radius:999px;background:var(--cream);font-size:14px;font-weight:600;color:var(--ink2)}
.filters button.on{background:var(--ink);color:#fff}
.diary{max-height:1040px;overflow-y:auto;padding-right:8px;padding-left:12px;margin-left:-12px;margin-top:10px;border-top:1px solid var(--rule);scrollbar-width:thin}
.mo-h{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:baseline;padding:18px 2px 10px;background:var(--paper);border-bottom:2px solid var(--ink)}
.mo-h b{font-family:var(--serif);font-size:22px}
.mo-h{gap:12px}
.mo-h span{font-family:var(--mono);font-size:13px;color:var(--dust);white-space:nowrap}
.diary .list{border-top:0}
.row .s.reps{color:var(--carmin);font-weight:600}
.rtabs{display:flex;gap:28px;margin:52px 0 0;border-bottom:1px solid var(--rule)}
.rtabs button{font-family:var(--serif);font-size:28px;font-weight:700;color:var(--dust);padding-bottom:10px;margin-bottom:-1px;border-bottom:3px solid transparent;transition:color .15s}
.rtabs button:hover{color:var(--ink2)}
.rtabs button.on{color:var(--ink);border-bottom-color:var(--carmin)}
#runs-left>.sec:first-child{margin-top:22px}
.wk-meta{display:flex;justify-content:space-between;margin:20px 0 10px;font-family:var(--mono);font-size:13.5px;color:var(--dust)}
.plan-seg{margin-top:22px}
.pb-sum{margin:16px 0 4px}
.pb-goal{font-family:var(--serif);font-size:22px;font-weight:700}
.pb-sum .muted{font-size:14px;margin-top:2px}
.pw.done{opacity:.6}
.ptest{margin:14px 0 4px;padding:16px 18px;border-radius:14px;background:var(--cream)}
.ptest p{font-size:14.5px;color:var(--ink2);margin:6px 0 8px}
.ptest.done{background:var(--carmin-soft)}
.pt-v{font-family:var(--serif);font-size:24px;font-weight:800;color:var(--carmin);margin-top:4px}
.wb.fut .wb-plan{border-color:var(--dust);opacity:.7}
.wb-plan em{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);padding-bottom:4px;font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--dust)}
.pw .mo-h .chip{font-family:var(--sans);font-size:11.5px;padding:3px 9px;margin-left:8px;vertical-align:3px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-top:28px}
.more{display:block;margin:22px auto 0;padding:12px 22px;border-radius:12px;background:var(--cream);font-weight:600}
@media (max-width:1100px){.runs-two{grid-template-columns:minmax(0,1fr)}.diary{max-height:75vh;padding-right:4px}}

/* ---------- races ---------- */
.pbs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule)}
.pb{padding:20px 18px 20px 0;border-bottom:1px solid var(--rule)}
.pb:not(:nth-child(3n+1)){padding-left:18px;border-left:1px solid var(--rule)}
.pb .l{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dust)}
.pb .v{font-family:var(--serif);font-size:36px;font-weight:800;line-height:1.1;margin:4px 0}
.pb .s{font-size:13.5px;color:var(--ink2)}
.pb.empty .v{color:var(--rule)}

/* ---------- sheet ---------- */
.veil{position:fixed;inset:0;background:rgba(26,20,16,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:50;display:none;align-items:center;justify-content:center;padding:24px}
.veil.on{display:flex;animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--paper);border-radius:24px;max-width:620px;width:100%;max-height:88vh;overflow:auto;padding:30px 30px 34px;box-shadow:0 30px 80px rgba(26,20,16,.3);animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.sheet-x{float:right;width:38px;height:38px;border-radius:50%;background:var(--cream);font-size:18px;text-align:center}
.sheet h3{font-family:var(--serif);font-size:32px;font-weight:800;line-height:1.1;margin:6px 0 8px;padding-right:40px}
.sheet p{font-size:15.5px;color:var(--ink2);margin-bottom:12px}
.sheet .why{font-size:14.5px;color:var(--dust);font-style:italic;margin-top:14px}
.steps{margin-top:18px}
.step{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--rule)}
.step .bar2{width:4px;border-radius:2px;background:var(--easy);flex-shrink:0}
.step.wu .bar2{background:var(--anil)} .step.main .bar2{background:var(--carmin)} .step.rest .bar2{background:var(--ochre)} .step.cd .bar2{background:var(--oliva)} .step.gut .bar2{background:var(--terra)} .step.note .bar2{background:var(--ink)}
.step .l{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dust)}
.step .v{font-family:var(--serif);font-size:20px;font-weight:700;margin:2px 0}
.step .v .p{font-family:var(--mono);font-size:16px;color:var(--carmin);font-weight:600;margin-left:6px}
.step .n{font-size:14.5px;color:var(--ink2)}
.kv{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:16px 0}
.kv div{padding:12px 8px}
.kv b{display:block;font-family:var(--serif);font-size:22px;font-weight:800}
.kv span{font-size:12.5px;color:var(--dust);font-weight:600}
table.sp{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
table.sp th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dust);text-align:left;padding:8px 6px;border-bottom:1px solid var(--rule)}
table.sp td{padding:8px 6px;border-bottom:1px solid var(--rule);font-family:var(--mono)}
table.sp td:first-child{font-family:var(--sans);font-weight:600}
.spbar{display:inline-block;height:6px;border-radius:3px;background:var(--carmin);opacity:.8;vertical-align:middle}
details.later{margin-top:10px}
details.later summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:16px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
details.later summary::-webkit-details-marker{display:none}
details.later summary .t{font-family:var(--serif);font-size:20px;font-weight:700;flex:1}
details.later[open] summary .arrow{transform:rotate(90deg)}

/* ---------- wide screens: use the whole width ---------- */
@media (min-width:1300px){
  main{max-width:1800px;padding:48px 64px 120px}
  .split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .split>.col{display:block}
  .split>.col>div:first-child>.sec{margin-top:40px}
  .split.r23{grid-template-columns:minmax(0,2fr) minmax(0,3fr)}
  .split.r56{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
  .sticky{position:sticky;top:24px;align-self:start}
  .rules{display:grid;grid-template-columns:1fr 1fr;column-gap:48px}
  .lede{max-width:900px}
  .split .paces{grid-template-columns:1fr 1fr}
  .split .pace:nth-child(2){border-right:0}
  .split .pace:nth-child(-n+2){border-bottom:1px solid var(--rule)}
}
@media (min-width:1600px){
  .weeks{gap:64px}
}

/* ---------- mobile ---------- */
@media (max-width:900px){
  .shell{display:block}
  .side{display:none}
  main{padding:26px 16px 120px}
  h1{font-size:46px}
  .sec{margin:40px 0 14px}
  .sec h2{font-size:23px;white-space:normal}
  .sec{flex-wrap:wrap;row-gap:4px}
  .sec .meta{white-space:normal;font-size:12.5px}
  .qa{flex-wrap:wrap;gap:4px 12px}
  .qa .q{flex:1 1 80%}
  .qa .a{order:3;width:100%}
  .hero{flex-direction:column;align-items:flex-start;padding:22px;gap:14px}
  .hero-t{font-size:31px}
  .hero-n{margin-left:0;padding-left:0;border-left:0;text-align:left;display:flex;align-items:baseline;gap:10px}
  .hero-n b{font-size:46px}
  .two{grid-template-columns:1fr;gap:34px;margin-top:30px}
  .paces,.nums{grid-template-columns:1fr 1fr}
  .pace:nth-child(2),.num:nth-child(2){border-right:0}
  .pace:nth-child(-n+2),.num:nth-child(-n+2){border-bottom:1px solid var(--rule)}
  .pace .v{font-size:24px}
  .phases,.plans{grid-template-columns:1fr}
  .ph,.ph+.ph,.pl,.pl+.pl{padding:16px 0;border-left:0}
  .ph+.ph{border-top:1px solid var(--rule)}
  .sess-grid{grid-template-columns:1fr}
  .sess{display:block;margin-bottom:22px}
  .wc{padding:20px 16px 16px}
  .wc-big{font-size:34px}
  .wc-plot{height:220px;margin-left:24px}
  .wc-bars{gap:2px}
  .wb-s em{display:none}
  .wc-key .muted{margin-left:0;width:100%}
  .runs-nums{grid-template-columns:1fr 1fr}
  .rtabs{gap:20px;margin-top:40px}
  .rtabs button{font-size:22px}
  .week7{grid-template-columns:repeat(7,1fr);gap:4px}
  .wd{padding:8px 5px;min-height:70px}
  .wd .t{font-size:12.5px}
  .wd .n{font-size:11.5px}
  .pbs{grid-template-columns:1fr 1fr}
  .pb,.pb:not(:nth-child(3n+1)){padding:16px 12px 16px 0;border-left:0}
  .pb:nth-child(2n){padding-left:14px;border-left:1px solid var(--rule)}
  .pb .v{font-size:28px}
  .stats3 .num{padding:16px 10px}
  .stats3 .num .v{font-size:24px}
  .kv{grid-template-columns:1fr 1fr}
  .row .d{width:52px}
  .row .t{font-size:17px}
  .vol .b span,.vol .b em{font-size:11.5px}
  .vol .b:nth-child(odd) span{visibility:hidden}
  .veil{align-items:flex-end;padding:0}
  .sheet{border-radius:24px 24px 0 0;max-height:90vh;padding:24px 18px calc(30px + env(safe-area-inset-bottom))}
  .sheet h3{font-size:27px}
  .bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(250,246,238,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--rule);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:12px;font-size:12px;font-weight:600;color:var(--dust)}
  .bar button .e{font-size:21px;line-height:1.1}
  .bar button.on{color:var(--carmin);background:var(--carmin-soft)}
}
</style>

   sessions:[
    {id:'flex',day:'Tue',t:'Quality',c:'tq',rpe:'4',flex:true,club:false,
     km:8.5,desc:'WU: 1.5km easy jog @ 5:40+/km, HR <140 (10min). Main: 3×10min @ LT1 (4:54/km, HR 148–58, RPE 3–4), 2min easy jog recovery. In Valencia summer heat, run HR-based - 5:05–5:15/km is fine if that holds HR under 158. First rep should feel almost too easy. Third rep: still conversational, short sentences possible. ~8.5km. CD: 1.5km easy jog (10min), HR dropping to <130. Coach: LT1 is your aerobic ceiling. These reps teach fat-burning efficiency - the exact mechanism needed for 42km. Three 10-minute reps is enough stimulus without digging deep. Walk away feeling like you had more in the tank. If any rep felt hard, you went too fast.'},
    {id:'wed',day:'Wed',t:'Gym',c:'tr2',rpe:'2',flex:false,club:false,
     km:0,desc:'Gym + 20min easy. HR <145. Easy run moved to Saturday this week.'},
    {id:'thu',day:'Thu',t:'LT1 intervals',c:'tq',rpe:'4',flex:false,club:false,
     km:10.5,desc:'WU: 2km easy @ 5:40+/km, HR <140 (12min). Main: 4\xd78min @ LT1 (4:54/km, HR 148-158, RPE 3-4), 90s standing rest - that is 32min of actual running, and the 4 reps ARE the whole main set (nothing hidden inside the number). The warm-up and cool-down below are extra, on top of it. Total for the session ~10.5km. Different structure from Tuesday - shorter reps, one more of them. In summer heat: run by HR, 5:05-5:15/km acceptable. CD: 1.5km easy jog, HR dropping to <130. Coach: A second LT1 session this week builds on Tuesday without repeating it. Four 8-minute reps create more total time at LT1 than three 10-minute reps would suggest - the shorter rest means lactate stays slightly elevated between reps, which is a different and complementary stress. Wednesday\' easy run is the buffer. Friday is easy. This session should not feel as hard as Tuesday did.'},
    {id:'fri',day:'Fri',t:'Easy + strides',c:'te',rpe:'2',flex:false,club:false,
     km:6,desc:'WU: None. Main: 35min easy @ 5:35-5:50/km, HR <145. ~6km. Run at a pace where conversation is easy. No pace targets, no watch pressure. Flat route if possible. CD: 4 x 20s strides - build to 4:10/km pace, walk back each time. Then 5min easy walk to bring HR below 120. Coach: This run has one job: arrive at Sunday\'s long run with loose legs and without fatigue. 35 minutes at easy HR is the exact dose. The strides keep the neuromuscular system engaged so Sunday does not start flat. If the legs feel heavy after Thursday club, drop to 5:50/km, HR <145 and skip the strides. Arriving at Sunday fresh matters more than hitting 35 minutes on Friday.'},
    {id:'sat',day:'Sat',t:'Easy',c:'te',rpe:'3',flex:false,club:false,
     km:7,desc:'7km easy @ 5:40–5:50/km, HR <145. HR <145. Moved from Wednesday. Keep it genuinely easy - this is the day before the long run, so arrive at Sunday with fresh legs.'},
    {id:'long',day:'Sun',t:'Long run',c:'tl',rpe:'3',flex:false,club:false,
     km:10.5,desc:'Total 60min (~10.5km). WU: First 10min very easy @ 5:45+/km, HR <135. Body waking up. Main: 45min @ 5:20–5:40/km, HR 135–148. Run by feel - if HR creeps above 150 in the heat, slow to 5:50. CD: Final 5min easy, HR <125. GUT: 1 gel at exactly 30min with water. Note brand, flavour, any bloating or GI discomfort. Gut training session 1. Coach: Every Sunday from now until October has a purpose. W1 is pure base - teaching your aerobic system to sustain effort over time. 60min at easy HR does more long-term good than 50min at moderate effort. Your stomach needs 16 weeks of practice. Start today.'}
   ]},
  {id:'mbw2',wk:'MB W2 (Jun 8–14)',vol:'49km',tag:'',
   note:'Add a rep to Monday. The long run extends to 70min  -  first run where two gels are needed.',
   sessions:[
    {id:'club1',day:'Tue',t:'Easy',c:'tq',rpe:null,flex:false,club:false,
     km:11,desc:'Club session  -  log after.'},
    {id:'wed',day:'Wed',t:'Easy / Gym',c:'te',rpe:'3',flex:false,club:false,
     km:7,desc:'7km easy @ 5:40–5:50/km, HR <145. Or gym + 20min easy. Hard cap: never quicker than 5:40/km and HR never over 148, even on fresh legs - if unsure, go slower. Add 20-30s/km in the heat and run to HR.'},
    {id:'club2',day:'Thu',t:'Club',c:'tq',rpe:null,flex:false,club:true,
     km:10,desc:'Club session  -  log after.'},
    {id:'flex',day:'Sat',t:'Shakeout',c:'te',rpe:'1–2',flex:false,club:false,
     km:10,desc:'Shakeout, ~10km at a VERY easy pace @ 5:55-6:15/km, HR <140 - deliberately slower than your normal easy runs. You have already done two hard club sessions this week (Tue and Thu), so this is just relaxed aerobic volume and loose legs, no third hard session. Run it fully by feel, no watch pressure. If the legs feel heavy from the week, cut it to 6-8km - arriving fresh for the 5K tomorrow matters more than the distance.'},
    {id:'long',day:'Sun',t:'5K Race',c:'tx',rpe:'6',flex:false,club:false,
     km:11,desc:'Runners Ciutat club 5K, your home race - but it is the morning after a Saturday party, so this is NOT a race effort. This replaces the Sunday long run this week. Total ~11km: 3km warm-up + 5km at ~4:30/km + 3km cool-down (these are separate and add together). WU: 3km easy @ 5:30/km, HR <145, then 4x20s strides. Main: 5km steady at 4:30/km (about 22:30, HR 165-175). Comfortable-hard and controlled - do not chase a PB on tired, dehydrated legs. CD: 3km easy jog @ 5:45/km, HR <145. Coach: After a party the legs and fuel tank will not be at their best, so run this as a relaxed tempo at 4:30/km, not a benchmark. Run by feel, enjoy the club race, and save the real efforts for when you are fresh. Keep Monday quality easy this week. Log it for the record.'}
   ]},
  {id:'mbw3',wk:'MB W3 (Jun 15–21) – RACE',vol:'46km',tag:'RACE',
   note:'A full training week with the Ponle Freno 10K on Sunday - not a taper, so the volume stays up. LT1 session Tuesday, volume banked Wednesday, legs fresh Thursday and Friday into the race. No club this week - the quality comes from Tuesday’s aerobic threshold work and Sunday’s race itself, which is a full VO2max stimulus.',
   sessions:[
    {id:'mon',day:'Mon',t:'Gym',c:'tr2',rpe:'3',flex:false,club:false,
     km:0,desc:'Gym / strength session (squats, hip thrusts, lunges, vertical jumps, skipping) + core. No running today - keep Monday gym-only. Race week volume comes from Tuesday LT1 session and Wednesday easy run.'},
    {id:'club1',day:'Tue',t:'LT1 reps',c:'tq',rpe:'5-6',flex:false,club:false,
     km:10,desc:'WU: 2km easy @ 5:45+/km, HR <130. Main: 3×8min @ LT1 (4:54/km, HR 148–158), 90s standing rest. CD: 2km easy. Total ~10km, ~50min. Coach: last quality hit before Sunday’s 10K - LT1 is the right dose, not T-pace. 5 days out is the sweet spot for stimulus without compromising the race. 24 total minutes at aerobic threshold. Run the reps by HR, not pace - if the heat pushes pace to 5:00–5:05, fine as long as HR stays 148–158.'},
    {id:'wed',day:'Wed',t:'Easy',c:'te',rpe:'3',flex:false,club:false,
     km:12,desc:'12km easy @ 5:20–5:40/km, HR <148. Volume anchor of the week - no long run, no Sunday easy, so this is where the mileage lives. Keep it genuinely aerobic. If legs feel heavy after Tuesday’s LT1 session, drop to 5:40–5:50/km and HR <145.'},
    {id:'club2',day:'Thu',t:'Off / Easy',c:'te',rpe:'1',flex:false,club:false,
     km:0,desc:'Rest day, or 6km very easy @ 5:45+/km, HR <135 if legs feel fresh. No quality. Three days before the race - the work is done, just keep the legs loose.'},
    {id:'fri',day:'Fri',t:'Easy + strides',c:'te',rpe:'2',flex:false,club:false,
     km:5,desc:'5km easy @ 5:40–5:50/km, HR <140. End with 4×20s strides - build to 4:10/km, walk back each time. Keep it short. 2 days before the race, this is activation only - legs should feel springy leaving, not tired.'},
    {id:'sat',day:'Sat',t:'Shakeout',c:'te',rpe:'2',flex:false,club:false,
     km:4,desc:'3–4km very easy @ 5:45+/km, HR <140, or rest. Day before the race - legs loose, not tired.'},
    {id:'race10k',day:'Sun',t:'10K Race',c:'tx',rpe:'8',flex:false,club:false,
     km:15,desc:'Ponle Freno 10K, Valencia - evening race (around 18:00), the effort that caps a full training week before your holiday. Total ~15km: 3km warm-up + 10km race + 2km cool-down. WU: 3km easy @ 5:30/km (HR <150) + 4x20s strides, finishing close to gun time. Main: 10km strong and controlled - target around your 10K PB (41:07, ~4:07/km), but it is an evening race in June heat on slightly worked legs, so run by feel: settle the first 3-4km at ~4:12/km (HR 175-185), then squeeze the back half. CD: 2km easy jog. Fuelling: main meal early afternoon (3-4h before), kept light. Coach: A complementary effort to the 14 Jun 5K - a 10K stresses the aerobic engine you are building for the marathon and is your first proper fitness readout. You banked the mileage Mon-Thu, so judge this on effort, not just the clock. Then the holiday (22-27 Jun) is full easy recovery. A sub-42 on a warm evening means the base work is landing.'}
   ]},
  {id:'mbw4',wk:'MB W4 (Jun 29–Jul 5) – REBUILD',vol:'23km',tag:'REBUILD',
   note:'Re-entry week. The holiday week (22-28 Jun) has been removed - no runs happened, and it is behind us. Nine days off plus a bug means a given easy pace now costs 8-10 more bpm than a fortnight ago, so this week is strictly HR-capped: every run under 150bpm, no exceptions, even if that means 5:30-5:50/km and feeling like you are holding back. No quality, no threshold. Let the pace come back to you. The threshold block now starts next week, and the Jul 20-26 deload has been dropped because this involuntary break replaces it.',
   sessions:[
    {id:'mon',day:'Mon',t:'Rest',c:'tr2',rpe:'1',flex:false,club:false,
     km:0,desc:'Rest / recovery from illness. No running. Light mobility only if you feel like it.'},
    {id:'tue',day:'Tue',t:'Easy',c:'te',rpe:'3',flex:false,club:false,
     km:5,desc:'DONE - 5.04km @ 5:00/km, avg HR 160. First run back. Good instinct keeping it short. A touch quick for a re-entry run (HR sat in the steady zone, not easy), which is exactly what 9 days off does to the heart-rate cost of a pace. Nothing wrong - just cap the rest of the week under 150bpm.'},
    {id:'wed',day:'Wed',t:'Easy',c:'te',rpe:'3',flex:false,club:false,
     km:8,desc:'DONE - 8.06km @ 5:08/km, avg HR 159. Second day back, similar profile: easy pace, steady HR. Sensible. From here, ease the pace off another 20-30s/km and let HR settle under 150.'},
    {id:'thu',day:'Thu',t:'Rest',c:'tr2',rpe:'1',flex:false,club:false,
     km:0,desc:'Rest - no run. Fine in a rebuild week, the legs are still clearing the bug. You ran Friday instead, so nothing is lost.'},
    {id:'fri',day:'Fri',t:'Rest / Easy',c:'tr2',rpe:'2',flex:true,club:false,
     km:0,desc:'Rest, or 5km very easy @ 5:40–6:00/km, HR <145 if the legs feel good. Optional light gym / mobility. The priority is arriving at the weekend runs fresh, not banking mileage.'},
    {id:'sat',day:'Sat',t:'Rest',c:'tr2',rpe:'1',flex:false,club:false,
     km:0,desc:'Rest - no run. You banked a relaxed 17km on Sunday instead, so the week finished with a strong aerobic long run.'},
    {id:'long',day:'Sun',t:'Easy longer',c:'tl',rpe:'3',flex:false,club:false,
     km:9.5,desc:'Total ~55min (~9.5km). WU: 10min very easy @ 5:50+/km, HR <135. Main: 40min @ 5:25–5:45/km, HR <150 - back off to 5:50 in the heat rather than push HR. CD: 5min easy. GUT: 1 gel at 30min with water to restart the gut protocol. Not a full long run - a relaxed aerobic hour to prove the week landed and set up the threshold block. Coach: this is the bridge back. If it feels comfortable and HR behaves under 150, you are ready for Monday. If it is a grind, repeat another easy week before touching quality - no shame and no cost, the block is already re-sequenced to allow it.'}
   ]},
 ]},
 {phase:'threshold',label:'Marathon Block – Threshold (Jul 6–Jul 26)',cls:'threshold',pnote:'Three weeks of proper quality after the rebuild. Monday becomes a real session. Long runs extend to 100min with gut training continuing weekly. The planned deload was dropped - the holiday-plus-illness break already served as one - so this block runs straight into the specificity phase. Watch the load: if any week feels like a grind, hold intensity and let the aerobic work do it. Easy-day discipline is now a priority alongside quality: cap easy runs at 5:40/km and HR 148, slower in heat. W5-W6 easy days drifted to 5:15/km and HR 158 - that grey-zone running is the single thing holding the aerobic base back. Slow easy equals faster on race day.',weeks:[
  {id:'mbw5',wk:'MB W5 (Jul 6–12)',vol:'54km',tag:'',
   note:'First proper threshold Monday, one week later than originally planned after the rebuild. 5 reps at T-pace. If 4:28 feels impossible, run 4:35–4:38 for all reps  -  do not chase splits at the cost of form. If the rebuild week still felt heavy, hold the reps at the easy end and let HR govern.',
   sessions:[
    {id:'gym',day:'Mon',t:'Gym',c:'tr2',rpe:'2',flex:false,club:false,
     km:0,desc:'Gym / strength day. Do the club strength session (squats, hip thrusts, lunges, vertical jumps with and without weight, skipping) at the reps for the current week, plus core and 4min of skipping at the end. Optional 20min very easy jog (5:50+/km) before or after if the legs feel fresh and you have time. No hard running today.'},
    {id:'club1',day:'Tue',t:'Club',c:'tq',rpe:null,flex:false,club:false,
     km:11,desc:'Club session  -  log after.'},
    {id:'wed',day:'Wed',t:'Easy / Gym',c:'te',rpe:'3',flex:false,club:false,
     km:8,desc:'8km easy @ 5:40–5:50/km, HR <145. Or gym + 20min easy. Hard cap: never quicker than 5:40/km and HR never over 148, even on fresh legs - if unsure, go slower. Add 20-30s/km in the heat and run to HR.'},
    {id:'club2',day:'Thu',t:'Club',c:'tq',rpe:null,flex:false,club:true,
     km:10,desc:'Club session  -  log after.'},
    {id:'flex',day:'Fri / Sat',t:'T-pace intervals',c:'tq',rpe:'7',flex:true,club:false,
     km:11,desc:'11km. WU: 2km easy. Main: 5\xd78min @ T pace (4:28–4:38/km, HR 165–175), 90s standing rec. CD: 2km easy. Should feel controlled but uncomfortable. HR 168–175. If HR isn’t recovering below 165 in 90s by rep 3–4, reduce reps to 4.'},
    {id:'long',day:'Sun',t:'Long run',c:'tl',rpe:'3–4',flex:false,club:false,
     km:14,desc:'Total 80min (~14km). WU: First 10–15min very easy @ 5:50+/km, HR <135. Main: 60min @ 5:20–5:40/km, HR 135–148. First run over 70min in the threshold phase. Stay aerobic throughout. CD: Final 5min easy walk/jog. GUT: Gel 1 at 30min, Gel 2 at 60min, water with each. Coach: The long run crosses 80min in the threshold phase. If you stay aerobic (HR <148), the final 20min is where fat-burning adaptation happens most strongly. Running faster blunts this effect. Stay slow, stay patient, trust the process.'}
   ]},
  {id:'mbw6',wk:'MB W6 (Jul 13–19)',vol:'47km',tag:'',
   note:'Volume recalibrated to ~52km. The original ~60km target assumed an uninterrupted build - the holiday and illness broke it (recent weeks 37-46km, block max 46.4km). Monday was an unplanned 14km interval session, so Thursday is cut to full rest. Friday (MP + threshold) and Sunday (long run) are the only two sessions that matter this week - protect them.',
   sessions:[
    {id:'gym',day:'Mon',t:'Gym',c:'tr2',rpe:'2',flex:false,club:false,
     km:0,desc:'Gym / strength day. Do the club strength session (squats, hip thrusts, lunges, vertical jumps with and without weight, skipping) at the reps for the current week, plus core and 4min of skipping at the end. Optional 20min very easy jog (5:50+/km) before or after if the legs feel fresh and you have time. No hard running today.'},
    {id:'club1',day:'Tue',t:'Club',c:'tq',rpe:null,flex:false,club:false,
     km:11,desc:'Club (Grupo Pistas) if it is on this week - log after. If club is OFF: this is a self-directed aerobic day, 10-12km steady @ 5:20-5:40/km, HR 140-150, with 4x20s strides (scale down on cutback and race weeks). Do not turn a no-club Tuesday into a second hard session - Friday is the quality day.'},
    {id:'wed',day:'Wed',t:'Easy / Gym',c:'te',rpe:'3',flex:false,club:false,
     km:8,desc:'8km easy @ 5:40–5:50/km, HR <145. Or gym + 20min easy. Hard cap: never quicker than 5:40/km and HR never over 148, even on fresh legs - if unsure, go slower. Add 20-30s/km in the heat and run to HR.'},
    {id:'club2',day:'Thu',t:'Rest',c:'tr2',rpe:'0',flex:false,club:false,
     km:0,desc:'Rest day - deliberately cut. Monday was an unplanned 14km interval session, so the week was already front-loaded at 24km by Tuesday. Full rest here protects Friday (MP + threshold) and Sunday (long run), the two sessions that actually matter. Week lands ~52km, a sensible step up on a 46.4km block max.'},
    {id:'flex',day:'Fri / Sat',t:'MP + Threshold',c:'tq',rpe:'6–7',flex:true,club:false,
     km:12,desc:'12km. WU: 2km easy. Main: 20min @ MP (4:55/km), 3min easy jog, then 15min @ T (4:28–4:38/km). CD: 2km easy. Notice how MP feels almost comfortable compared to T-pace. That’s the point. HR 163–172 on MP section, 168–175 on T section.'},
    {id:'long',day:'Sun',t:'Long run',c:'tl',rpe:'4',flex:false,club:false,
     km:16,desc:'Total 90min (~16km). WU: First 10-15min very easy @ 5:50+/km, HR <130. Main: 70min @ 5:20-5:40/km, HR 135-148. Substantial aerobic run - stay honest on pace. July heat: 5:40-5:50/km, HR <145 is correct. CD: Final 5min easy walk/jog. GUT: Gel at 25min, 50min and 75min, water with each. All three land while you are still running - a gel at 90min on a 90min run does nothing, it needs 15-20min to absorb. This rehearses the every-25min race cadence (a 3:30 marathon needs roughly 7-8 gels). If no GI issues two weeks running with this brand: this is your race gel. Note it. Coach: Ninety minutes, proper marathon training territory. Gels every 25min hold blood glucose better than any other strategy for 3-hour-plus efforts. Train the habit now.'},
   ]},
  {id:'mbw7',wk:'MB W7 (Jul 20–26)',vol:'61km',tag:'',
   note:'Volume recalibrated to ~56km (was ~64km, which assumed a build that never happened). The long run is now the priority of this block: longest to date is 17km with the marathon 10 weeks out, and that gap decides race day. Six T-pace reps stays as the single hard session; everything else is aerobic. Club is on summer break, so Tuesday is self-directed and Thursday is rest.',
   sessions:[
    {id:'gym',day:'Mon',t:'Gym',c:'tr2',rpe:'2',flex:false,club:false,
     km:0,ctx:'Strength day - no run. Strength holds your form together in the last 10km of the marathon.',steps:[{l:'Strength',ty:'main',d:'Gym',n:'Club strength work: squats, hip thrusts, lunges, vertical jumps, skipping. Finish with core and 4min skipping.'}],desc:'<strong>Gym / strength - no run today (gym is Mon and Sat).</strong><br><br><strong>Session:</strong> club strength work - squats, hip thrusts, lunges, weighted and unweighted vertical jumps, skipping, at this week reps. Finish with core and 4min skipping.<br><br><strong>Why:</strong> strength holds your form together in the last 10km of the marathon. Keep it clear of Sunday legs.'},
    {id:'club1',day:'Tue',t:'Aerobic',c:'tq',rpe:null,flex:false,club:false,
     km:11,min:62,ctx:'Your midweek aerobic block. Controlled and even, not a race.',why:'Main midweek aerobic volume. If you go to a club session instead, run that and tell me.',steps:[{l:'Warm-up',ty:'wu',d:'2km',pace:'5:40',hr:'<140',z:'Easy'},{l:'Main set',ty:'main',d:'8km',pace:'5:20-5:40',hr:'140-150',z:'Easy (top)',n:'Controlled and even. Steady aerobic running, never a grind.'},{l:'Strides',ty:'rest',d:'4 × 20s',pace:'build to 4:10',n:'Walk back to full recovery after each.'},{l:'Cool-down',ty:'cd',d:'1km',z:'Easy'}],desc:'<strong>Aerobic session (our plan) - 11km.</strong><br><br><strong>WARM-UP:</strong> 2km easy @ 5:40/km, HR under 140.<br><strong>MAIN:</strong> 8km steady @ 5:20-5:40/km, HR 140-150 (Z2 top), controlled and even.<br><strong>STRIDES:</strong> 4 x 20s, build to 4:10/km, walk back.<br><strong>COOL-DOWN:</strong> 1km easy.<br><br><strong>Why:</strong> your main midweek aerobic block. Controlled, not a race. If you go to a club session instead, run that and tell me.'},
    {id:'club2',day:'Thu',t:'Easy',c:'te',rpe:'3',flex:false,club:false,
     km:8,min:46,ctx:'Easy aerobic with strides. In heat run to HR and let the pace sit where it wants.',why:'Pure aerobic volume - the running that actually builds the marathon. Not a second quality day.',steps:[{l:'Main set',ty:'main',d:'8km',pace:'5:35-5:55',hr:'140-148',z:'Easy'},{l:'Strides',ty:'rest',d:'4 × 20s',pace:'build to 4:10',n:'In the last 2km. Walk back to full recovery after each.'}],desc:'<strong>Easy aerobic - 8km. Our session, not club.</strong><br><br><strong>Pace:</strong> 5:35-5:55/km (Z2, ~65% VAM). <strong>HR:</strong> 140-148, hard cap 148. <strong>RPE:</strong> 3.<br><br>Conversational the whole way. In heat, run to HR and let pace sit where it wants.<br><br><strong>Strides (last 2km):</strong> 4 x 20s, build to 4:10/km, walk back to full recovery each.<br><br><strong>Why:</strong> pure aerobic volume - the running that actually builds the marathon.'},
    {id:'flex',day:'Fri / Sat',t:'T-pace intervals',c:'tq',rpe:'7–8',flex:true,club:false,
     km:13,min:70,ctx:'Biggest threshold session in the block.',why:'If HR is not recovering below 165 within the 90s by rep 4-5, stop at 5 reps. Form beats the 6th rep.',steps:[{l:'Warm-up',ty:'wu',d:'2km',pace:'5:40',hr:'<140',z:'Easy'},{l:'Main set',ty:'main',d:'6 × 8min',pace:'4:28-4:38',hr:'165-175',z:'Threshold'},{l:'Rest',ty:'rest',d:'90s',n:'Standing, between reps.'},{l:'Cool-down',ty:'cd',d:'2km',z:'Easy'}],desc:'<strong>Threshold intervals - biggest T session of the block. Total 13km.</strong><br><br><strong>WARM-UP:</strong> 2km easy @ 5:40/km, HR under 140.<br><strong>MAIN:</strong> 6 x 8min @ T pace 4:28-4:38/km, HR 165-175 (Z4). <strong>Recovery:</strong> 90s standing between reps.<br><strong>COOL-DOWN:</strong> 2km easy.<br><br><strong>Bail-out:</strong> if HR is not recovering below 165 in 90s by rep 4-5, stop at 5 reps. Form beats the 6th rep.<br><br><strong>TOTAL: 13km.</strong>'},
    {id:'wed',day:'Sat',t:'Easy',c:'te',rpe:'3',flex:false,club:false,
     km:9,min:57,ctx:'Moved from Wednesday (gym took the Wed slot this week). Run done Sat 25 Jul.',why:'Aerobic volume and recovery between the quality days. Protects Sunday.',steps:[{l:'Main set',ty:'main',d:'9km',pace:'5:40-5:50',hr:'<145 (cap 148)',z:'Easy'}],desc:'<strong>Easy aerobic - 9km (moved from Wed 22 Jul).</strong><br><br><strong>Pace:</strong> 5:40-5:50/km (Z2). <strong>HR:</strong> under 145, hard cap 148. Genuinely easy - day before the long run, so arrive at Sunday fresh.'},
    {id:'long',day:'Sun',t:'Long run',c:'tl',rpe:'4',flex:false,club:false,
     km:20,min:110,ctx:'Longest run of the block so far. Distance is the goal, pace is irrelevant.',fuel:'Gel at 25 / 50 / 75 / 100min, water with each. Four gels rehearses the every-25min race cadence.',why:'The long run climbs every week from here toward 30-32km by mid-September.',steps:[{l:'Warm-up',ty:'wu',d:'15min',pace:'5:50+',hr:'<130',z:'Easy',n:'Ease in.'},{l:'Main set',ty:'main',d:'90min',pace:'5:20-5:45',hr:'135-148',z:'Easy',n:'July heat: 5:45-6:00/km at HR under 148 is correct - do not chase pace.'},{l:'Cool-down',ty:'cd',d:'5min',z:'Very easy'}],desc:'<strong>Long run - longest of the block so far. Total ~20km / 110min.</strong><br><br><strong>WARM-UP:</strong> 15min very easy @ 5:50+/km, HR under 130. Ease in.<br><strong>MAIN:</strong> 90min easy @ 5:20-5:45/km, HR 135-148 (Z2). In July heat, 5:45-6:00/km at HR under 148 is correct - do not chase pace.<br><strong>COOL-DOWN:</strong> 5min very easy.<br><br><strong>FUEL:</strong> gel at 25 / 50 / 75 / 100min, water with each. Four gels rehearses the every-25min race cadence (sub-3:30 needs 7-8).<br><br><strong>Why:</strong> distance is the goal, pace is irrelevant. From here the long run climbs every week toward 30-32km by mid-September.<br><br><strong>TOTAL: ~20km.</strong>'},
   ]},
 ]},
 {phase:'specificity',label:'Marathon Block – Specificity (Jul 27–Aug 23)',cls:'specificity',pnote:'Long runs get serious. MP work appears in both the Tuesday quality session and the Sunday long run. The week is now front-loaded on purpose: quality Tuesday, everything after it easy, so the long run - the session that decides this block - starts on fresh legs. Every Sunday from W9 is a significant training stimulus. Gut and caffeine protocols are tested here  -  W11 is the first double-caffeine-gel run, exactly as race day.',weeks:[
  {id:'mbw9',wk:'MB W9 (Jul 27–Aug 2)',vol:'62km',tag:'',
   note:'House-move week. 40.7km run against a 62km target. The Tuesday threshold session was completed in full (3 x 12min at 4:33, 4:17, 4:39/km), but Sunday was cut to 11.1km and the 30min MP block was lost. Treat it as an unplanned deload, not a debt: the aerobic cost of one missed long run is small, and W11, W13 and W15 all still stand. The first MP-on-tired-legs block now lands on Sun 9 Aug instead.',
   sessions:[{id:'gym',day:'Mon',t:'Gym',c:'tr2',rpe:'2',flex:false,club:false,

     km:8,min:46,ctx:'Genuinely easy - if unsure, go slower. In heat add 20-30s/km and run to HR, not pace.',why:'Aerobic volume and recovery between the quality days. Protects Sunday.',steps:[{l:'Main set',ty:'main',d:'8km',pace:'5:40-5:50',hr:'<145 (cap 148)',z:'Easy'}],desc:'<strong>Easy aerobic - 8km. Gym is Mon and Sat, so today is a run.</strong><br><br><strong>Pace:</strong> 5:40-5:50/km (Z2). <strong>HR:</strong> under 145, hard cap 148. <strong>RPE:</strong> 2-3.<br><br>Genuinely easy - if unsure, slower. Add 20-30s/km in the heat and run to HR, not pace.<br><br><strong>Why:</strong> aerobic volume and recovery between the quality days. Protects Sunday.'},{id:'club2',day:'Thu',t:'Easy',c:'te',rpe:'3',flex:false,club:false,
     km:10,min:57,ctx:'Easy aerobic with strides. In heat run to HR and let the pace sit where it wants.',why:'Pure aerobic volume - the running that actually builds the marathon. Not a second quality day.',steps:[{l:'Main set',ty:'main',d:'10km',pace:'5:35-5:55',hr:'140-148',z:'Easy'},{l:'Strides',ty:'rest',d:'4 × 20s',pace:'build to 4:10',n:'In the last 2km. Walk back to full recovery after each.'}],desc:'<strong>Easy aerobic - 10km. Our session, not club.</strong><br><br><strong>Pace:</strong> 5:35-5:55/km (Z2, ~65% VAM). <strong>HR:</strong> 140-148, hard cap 148. <strong>RPE:</strong> 3.<br><br>Conversational the whole way. In heat, run to HR and let pace sit where it wants.<br><br><strong>Strides (last 2km):</strong> 4 x 20s, build to 4:10/km, walk back to full recovery each.<br><br><strong>Why:</strong> pure aerobic volume - the running that actually builds the marathon.'},{id:'club1',day:'Fri',t:'Easy',c:'te',rpe:'2-3',flex:false,club:false,km:11,min:63,ctx:'Genuinely easy - if unsure, go slower. In heat add 20-30s/km and run to HR, not pace.',steps:[{l:'Main set',ty:'main',d:'11km',pace:'5:40-5:50',hr:'<145 (cap 148)',z:'Easy'}],why:'Aerobic volume with zero stress - the quality was Tuesday, the long run is Sunday. This day protects both.',desc:'11km easy @ 5:40-5:50/km, HR <145 (cap 148). All volume, no stress - quality was Tuesday, Sunday is the long run.'},{id:'long',day:'Sun',t:'Long run',c:'tl',rpe:'5–6',flex:false,club:false,
     km:20,min:125,ctx:'First true race-specific session: marathon pace on tired legs.',fuel:'Gel at 30 / 60 / 90min (non-caf) + 105min (non-caf, sip water).',why:'MP on tired legs trains the exact state of km 30+. The first minute feels easy, by minute 20 it is work - closing that gap is the point.',steps:[{l:'Warm-up',ty:'wu',d:'15min',pace:'5:50+',hr:'<130',z:'Easy',n:'Ease in.'},{l:'Main set 1',ty:'main',d:'80min',pace:'5:30-5:45',hr:'135-148',z:'Easy',n:'Continuous aerobic running, RPE 3-4. About 14.5km.'},{l:'Main set 2',ty:'main',d:'30min',pace:'4:57',hr:'160-170',z:'MP',n:'No stop between sets - roll straight in. In heat, 5:05/km at the right HR is fine: hold effort, not the number.'},{l:'Cool-down',ty:'cd',d:'5min',hr:'<130',n:'Easy jog or walk.'}],desc:'<strong>Long run - marathon pace on tired legs. Total ~20km / 2h05.</strong><br><br><strong>WARM-UP:</strong> 15min very easy @ 5:50+/km, HR under 130. Ease in.<br><strong>MAIN 1 - aerobic base:</strong> 80min continuous easy @ 5:30-5:45/km, HR 135-148 (Z2), RPE 3-4. About 14.5km.<br><strong>TRANSITION:</strong> no stop - roll straight from easy into marathon pace.<br><strong>MAIN 2 - marathon pace:</strong> 30min @ MP 4:57/km, HR 160-170 (Z3), RPE 5-6. About 6km. In heat, 5:05/km at the right HR is fine - hold effort, not the number.<br><strong>COOL-DOWN:</strong> 5min easy jog or walk, HR under 130.<br><br><strong>FUEL:</strong> gel at 30 / 60 / 90min (non-caf) + 105min (non-caf, sip water).<br><br><strong>Why:</strong> first true race-specific session. MP on tired legs trains the exact state of km 30+. First minute feels easy, by minute 20 it is work - closing that gap is the point.<br><br><strong>TOTAL: ~20km.</strong>'}]},
  {id:'mbw10',wk:'MB W10 (Aug 3–9)',vol:'70km',tag:'',
   note:'Reshuffled after the house-move week. Tue 4 Aug became a 10.2km progression (5km @ 5:10, 5km @ 4:51) and the double MP session moved to Thursday. The long run slipped to Mon 10 Aug and went in at 24.65km in 2:42:06, avg HR 148 - 105min easy then 35min at MP, run as prescribed. Week landed at ~70km against a 67km target, so the house-move deficit is fully absorbed and nothing is owed.',
   sessions:[{id:'gym',day:'Mon',t:'Gym',c:'tr2',rpe:'2',flex:false,club:false,
     km:0,ctx:'Strength day - no run. Strength holds your form together in the last 10km of the marathon.',steps:[{l:'Strength',ty:'main',d:'Gym',n:'Club strength work: squats, hip thrusts, lunges, vertical jumps, skipping. Finish with core and 4min skipping.'}],desc:'<strong>Gym / strength - no run today (gym is Mon and Sat).</strong><br><br><strong>Session:</strong> club strength work - squats, hip thrusts, lunges, weighted and unweighted vertical jumps, skipping, at this week reps. Finish with core and 4min skipping.<br><br><strong>Why:</strong> strength holds your form together in the last 10km of the marathon. Keep it clear of Sunday legs.'},{id:'flex',day:'Tue',t:'Progression 10km',c:'tq',rpe:'5-6',flex:false,club:false,
     km:10.2,min:56,ctx:'Run as done on Tue 4 Aug - 2 x 5km, first block 5:10/km, second 4:51/km, 32C.',why:'The quality session moved to Thursday, so this stands as a controlled aerobic progression - honest work, not the key session of the week.',steps:[{l:'Warm-up',ty:'wu',d:'1km',pace:'6:52',hr:'123',z:'Easy',n:'Rolling start.'},{l:'Block 1',ty:'main',d:'5km',pace:'5:10',hr:'120-158',z:'Steady'},{l:'Recovery',ty:'rest',d:'~1km',pace:'6:38',n:'Easy jog between blocks.'},{l:'Block 2',ty:'main',d:'5km',pace:'4:51',hr:'140-166',z:'MP / steady'}],desc:'<strong>Progression 10km - logged Tue 4 Aug. Total 10.2km / 55:38.</strong><br><br><strong>BLOCK 1:</strong> 5km @ 5:10/km.<br><strong>RECOVERY:</strong> easy jog, roughly 1km @ 6:38/km.<br><strong>BLOCK 2:</strong> 5km @ 4:51/km, closing splits 4:55 / 4:49 / 4:49 / 5:09.<br><br><strong>Conditions:</strong> 32C. Avg HR 140, max 169 - low for that pace in that heat. <strong>Felt genuinely comfortable throughout (RPE 5).</strong> The HR number is not trustworthy, but the three splits at 4:49-4:55 held a flat 140-142 and the effort felt easy, so the aerobic read is real even if the absolute figure is not. Wear a chest strap on Thursday to calibrate it properly.<br><br><strong>Why it changed:</strong> the double MP session moved to Thursday after the house move ate last week, so Tuesday became a steady progression instead.'},{id:'wed',day:'Wed',t:'Easy / Gym',c:'te',rpe:'3',flex:false,club:false,
     km:10,min:57,ctx:'Genuinely easy - if unsure, go slower. In heat add 20-30s/km and run to HR, not pace.',why:'Lifted from 8km to 10km. The only honest place to add volume back this week, because it costs Sunday nothing.',steps:[{l:'Main set',ty:'main',d:'10km',pace:'5:40-5:50',hr:'<145 (cap 148)',z:'Easy'}],desc:'<strong>Easy aerobic - 10km, lifted from 8km. Gym is Mon and Sat, so today is a run.</strong><br><br><strong>Pace:</strong> 5:40-5:50/km (Z2). <strong>HR:</strong> under 145, hard cap 148. <strong>RPE:</strong> 2-3.<br><br>Genuinely easy - if unsure, slower. Add 20-30s/km in the heat and run to HR, not pace.<br><br><strong>Why:</strong> the extra 2km is the only volume added back after the 40km week. It sits on an easy day, three days clear of the long run, so it costs Sunday nothing.'},{id:'club2',day:'Thu',t:'Double MP blocks',c:'tq',rpe:'6–7',flex:false,club:false,
     km:13.5,min:72,ctx:'Moved from Tue 4 Aug. Two marathon-pace blocks - both should feel identical.',why:'40min of marathon pace in two blocks. Even effort across both is the skill being trained.',steps:[{l:'Warm-up',ty:'wu',d:'2km',pace:'5:40',hr:'<140',z:'Easy'},{l:'Main set 1',ty:'main',d:'20min',pace:'4:55',hr:'163-172',z:'MP'},{l:'Rest',ty:'rest',d:'5min',n:'Easy jog between blocks.'},{l:'Main set 2',ty:'main',d:'20min',pace:'4:55',hr:'163-172',z:'MP',n:'If HR was above 175 in set 1, you went too hard.'},{l:'Cool-down',ty:'cd',d:'3km',z:'Easy'}],desc:'<strong>Double marathon-pace blocks - MOVED FROM TUESDAY. Total 13.5km.</strong><br><br><strong>WARM-UP:</strong> 2km easy @ 5:40/km, HR under 140.<br><strong>MAIN:</strong> 2 x 20min @ MP 4:55/km. <strong>Recovery:</strong> 5min easy jog between blocks. That is 40min of marathon pace.<br><strong>COOL-DOWN:</strong> 3km easy.<br><br><strong>HR:</strong> 163-172 throughout. If you are above 175 in the first block you are working too hard - both blocks should feel identical.<br><br><strong>Key session of the week alongside Sunday.</strong> Thursday to Sunday is enough recovery for the 35min MP block on tired legs. Wear a chest strap - Tuesday HR data was not believable.<br><br><strong>TOTAL: 13.5km.</strong>'},{id:'club1',day:'Fri',t:'Easy',c:'te',rpe:'2-3',flex:false,club:false,km:11,min:63,ctx:'Genuinely easy - if unsure, go slower. In heat add 20-30s/km and run to HR, not pace.',steps:[{l:'Main set',ty:'main',d:'11km',pace:'5:40-5:50',hr:'<145 (cap 148)',z:'Easy'}],why:'Aerobic volume with zero stress - the quality was Tuesday, the long run is Sunday. This day protects both.',desc:'11km easy @ 5:40-5:50/km, HR <145 (cap 148). All volume, no stress - quality was Tuesday, Sunday is the long run.'},{id:'long',day:'Sun / Mon',t:'Long run - DONE',c:'tl',rpe:'6',flex:false,club:false,
     km:25,min:162,ctx:'DONE (ran Mon 10 Aug, 07:30): 24.65km in 2:42:06, avg HR 148 - 105min at 140-150 then 35min at MP, exactly as prescribed.',fuel:'Gel at 30 / 60min (non-caf), 75min (CAFFEINE TEST), 120min (non-caf if needed).',why:'The MP block grows from 30min (W9) to 35min, and you prove your race gel at the exact race-day elapsed time.',steps:[{l:'Warm-up',ty:'wu',d:'15min',pace:'5:50+',hr:'<130',z:'Easy'},{l:'Main set 1',ty:'main',d:'90min',pace:'5:30-5:45',hr:'135-148',z:'Easy',n:'At 75min: CAFFEINE TEST - take your chosen race gel (75mg caffeine). Log response time, energy and any gut reaction.'},{l:'Main set 2',ty:'main',d:'35min',pace:'4:57',hr:'160-170',z:'MP',n:'No stop between sets. About 7km at race pace on tired legs.'},{l:'Cool-down',ty:'cd',d:'5min',n:'Easy walk or jog.'}],desc:'<strong>DONE Mon 10 Aug: 24.65km in 2:42:06, avg HR 148.</strong><br><br><strong>Long run - MP on tired legs, caffeine-gel test. Total ~25km.</strong><br><br><strong>WARM-UP:</strong> 15min very easy @ 5:50+/km, HR under 130.<br><strong>MAIN 1 - aerobic base:</strong> 105min easy, HR 140-150.<br><strong>MAIN 2 - marathon pace:</strong> 35min @ MP 4:57/km, HR 160-170. No stop between sets.<br><strong>COOL-DOWN:</strong> 5min easy.<br><br><strong>FUEL:</strong> gel at 30 / 60min (non-caf), 75min (caffeine test), 120min (non-caf if needed).'}]},
  {id:'mbw11',wk:'MB W11 (Aug 10–16)',vol:'61.5km',tag:'',
   note:'Hardest week of the specificity block, reshuffled to put the long run on Saturday. Mon 10 Aug took the W10 long run (24.65km), Tuesday was rest, Wednesday 12 Aug is gym. The 4 x 10min threshold moves to Thursday 13 Aug, Friday stays easy, and the 26km long run moves to Saturday 15 Aug with an easy 11km on Sunday behind it. Note the compression: only one easy day sits between 40min of threshold and the biggest race-specific session of the phase. If anything has to give this week it is Thursday, never Saturday.',
   sessions:[{id:'opener',day:'Mon',t:'Easy - DONE',c:'te',rpe:'3',flex:false,club:false,km:11.5,min:63,ctx:'DONE: 11.45km @ 5:14/km, avg HR 153 - run Sunday evening. This is the Monday session of W11 and counts to this week.',steps:[{l:'Main set',ty:'main',d:'11.5km',pace:'5:40-5:50',hr:'<148',z:'Easy'}],why:'Aerobic volume to open the week.',desc:'DONE - 11.45km @ 5:14/km, avg HR 153, run Sunday evening. Monday session of W11.'},{id:'wed',day:'Tue',t:'Rest',c:'tr2',rpe:'1',flex:false,club:false,km:0,ctx:'Rest after the displaced 24km long run. The week continues Wednesday with the threshold session.',steps:[{l:'Rest',ty:'cd',d:'Rest',n:'Full rest. Yesterday was 24km with 35min at MP - absorb it.'}],desc:'Rest day - the 24km long run landed on Monday, so recovery goes here and the quality slides to Wednesday.'},{id:'flex',day:'Wed',t:'Gym',c:'tr2',rpe:'2',flex:false,club:false,
     km:0,ctx:'Strength day - no run. Threshold moved to Thursday to open up a Saturday long run.',why:'Strength holds your form together in the last 10km of the marathon. Keep it clear of the long-run legs.',steps:[{l:'Strength',ty:'main',d:'Gym',n:'Club strength work: squats, hip thrusts, lunges, vertical jumps, skipping. Finish with core and 4min skipping.'}],desc:'<strong>Gym / strength - no run today.</strong><br><br><strong>Session:</strong> club strength work - squats, hip thrusts, lunges, weighted and unweighted vertical jumps, skipping. Finish with core and 4min skipping.<br><br><strong>Why:</strong> the threshold session moved to Thursday so the long run could go on Saturday. That leaves today as the strength day. Keep the legs out of it - Thursday and Saturday are both big.'},{id:'club2',day:'Thu',t:'T-pace high vol',c:'tq',rpe:'7–8',flex:false,club:false,
     km:14,min:74,ctx:'Moved from Wednesday. High-volume threshold: 40min at T pace.',why:'Expect it to hurt from rep 3 - that is the adaptation stimulus. But Saturday outranks this session, so leave something in the tank.',steps:[{l:'Warm-up',ty:'wu',d:'2km',pace:'5:40',hr:'<140',z:'Easy'},{l:'Main set',ty:'main',d:'4 × 10min',pace:'4:28-4:38',hr:'168-175',z:'Threshold'},{l:'Rest',ty:'rest',d:'2min',n:'Easy jog, between reps.'},{l:'Cool-down',ty:'cd',d:'4km',z:'Easy'}],desc:'<strong>High-volume threshold - MOVED FROM WEDNESDAY. Total 14km.</strong><br><br><strong>WARM-UP:</strong> 2km easy @ 5:40/km, HR under 140.<br><strong>MAIN:</strong> 4 x 10min @ T pace 4:28-4:38/km, HR 168-175 (Z4). <strong>Recovery:</strong> 2min easy jog between reps. 40min at threshold.<br><strong>COOL-DOWN:</strong> 4km easy.<br><br><strong>Bail-out:</strong> stop at 3 reps if HR is not settling in the 2min jog, or if the pace is drifting past 4:40. Saturday is the session that matters this week and it needs your legs, so 3 good reps beats 4 ragged ones.<br><br><strong>TOTAL: 14km.</strong>'},{id:'club1',day:'Fri',t:'Easy',c:'te',rpe:'2-3',flex:false,club:false,km:11,min:63,ctx:'Genuinely easy - if unsure, go slower. In heat add 20-30s/km and run to HR, not pace.',steps:[{l:'Main set',ty:'main',d:'11km',pace:'5:40-5:50',hr:'<145 (cap 148)',z:'Easy'}],why:'Aerobic volume with zero stress - the quality was Tuesday, the long run is Sunday. This day protects both.',desc:'11km easy @ 5:40-5:50/km, HR <145 (cap 148). All volume, no stress - quality was Tuesday, Sunday is the long run.'},{id:'sun',day:'Sat',t:'Easy - skipped',c:'tr2',rpe:'1',flex:false,club:false,km:0,ctx:'Skipped - felt tired, so the day was taken as rest and the long run moved to Sunday. Correct call.',steps:[{l:'Rest',ty:'cd',d:'Rest',n:'Skipped by choice after a heavy week. Tired legs before a 25km MP long run is a good reason to rest, not to grind.'}],desc:'Skipped - felt tired. Rested instead and moved the long run to Sunday.'},{id:'long',day:'Sun',t:'Long run - DONE',c:'tl',rpe:'7',flex:false,club:false,km:25,min:145,ctx:'DONE Sun 16 Aug in 32C: 25.00km in 2:24:56, avg HR 157. 90min at marathon pace or quicker (60 + 30). Moved from Saturday.',fuel:'Gel at 30 / 60 / 90min (non-caf), 105min (caf 75mg simulation), 120min (non-caf).',why:'Two long MP blocks deep into a 25km run. This is the session that says sub-3:30 is real.',steps:[{l:'Warm-up',ty:'wu',d:'30min',pace:'6:00-6:15',hr:'129-140',z:'Easy',n:'Done - eased in properly.'},{l:'Main set 1',ty:'main',d:'60min',pace:'4:58 avg',hr:'152-172',z:'MP',n:'12km, run as a progression from 5:19 down to 4:34. Faster than prescribed at the end.'},{l:'Float',ty:'rest',d:'~2min',n:'Brief break between blocks.'},{l:'Main set 2',ty:'main',d:'30min',pace:'4:58 avg',hr:'166-172',z:'MP',n:'~6km at 4:55-5:03, held steady on tired legs after an hour of MP work.'},{l:'Cool-down',ty:'cd',d:'1.6km',n:'Easy home.'}],desc:'<strong>DONE Sun 16 Aug - 25.00km in 2:24:56, avg HR 157, 32C.</strong><br><br>30min warm-up, then 60min at 4:58 avg (progressive 5:19 to 4:34), short float, then 30min at 4:58 (4:55-5:03), then 1.6km home. 90 minutes at marathon pace or quicker. Moved from Saturday after a rest day.'}]},{id:'mbw12',wk:'MB W12 (Aug 17–23)',vol:'59km',tag:'HM',
   note:'Deload week between two 70km weeks. The half-marathon race option is dropped - you have no races before the September 5K. Volume eases to ~55km rather than the old ~46km, because that deeper cut only existed to taper for a race you are no longer running. Wednesday and Thursday go back to normal aerobic days. The job this week is to absorb W11 and arrive fresh for the 30km key long run in W13. Absorb, do not attack.',
   sessions:[{id:'gym',day:'Mon',t:'Easy - DONE',c:'te',rpe:'3',flex:false,club:false,km:11.2,min:64,ctx:'DONE Mon 17 Aug in England: 11.21km at 5:29/km, avg HR 142. Note the number - that pace cost 153-157 in Valencia. Cool air is worth roughly 12 beats.',steps:[{l:'Main set',ty:'main',d:'11.2km',pace:'5:29',hr:'142 avg',z:'Easy'}],why:'Opens the deload week. Strength work moves to Wednesday.',desc:'DONE Mon 17 Aug - 11.21km at 5:29/km, avg HR 142 in England. Same pace as a Valencia easy run at 12 beats cheaper.'},{id:'flex',day:'Tue',t:'MP sharpener',c:'tq',rpe:'5–6',flex:true,club:false,
     km:9,min:48,ctx:'Light MP sharpener - legs are being saved for the long runs. If Sunday left the legs dead, slide this to Wednesday - never later than that.',why:'Just enough to keep the MP feel sharp in the deload week.',steps:[{l:'Warm-up',ty:'wu',d:'2km',pace:'5:40',hr:'<140',z:'Easy'},{l:'Main set 1',ty:'main',d:'10min',pace:'4:55',hr:'160-170',z:'MP'},{l:'Rest',ty:'rest',d:'3min',n:'Easy jog between blocks.'},{l:'Main set 2',ty:'main',d:'10min',pace:'4:55',hr:'160-170',z:'MP'},{l:'Cool-down',ty:'cd',d:'3km',z:'Easy'}],desc:'<strong>Marathon-pace sharpener - light touch. Total 9km.</strong><br><br><strong>WARM-UP:</strong> 2km easy @ 5:40/km, HR under 140.<br><strong>MAIN:</strong> 2 x 10min @ MP 4:55/km, HR 160-170. <strong>Recovery:</strong> 3min easy jog between blocks.<br><strong>COOL-DOWN:</strong> 3km easy.<br><br><strong>Why light:</strong> legs are being saved for the big long runs. Just enough to keep MP feel sharp.<br><br><strong>TOTAL: 9km.</strong>'},{id:'wed',day:'Wed',t:'Gym / rest',c:'tr2',rpe:'2',flex:false,club:false,km:0,ctx:'Strength day, no run. Monday became a run this week, so the gym slot moves here and the week stays a genuine deload.',steps:[{l:'Strength',ty:'main',d:'Gym',n:'Squats, hip thrusts, lunges, jumps, skipping, core. Optional 20min very easy jog afterwards if the legs want it.'}],why:'Protects the deload. W13 has the 30km key run and needs you fresh.',desc:'Gym / rest. Monday became a run this week so strength moves here, keeping W12 a true deload.'},{id:'club2',day:'Thu',t:'Easy',c:'te',rpe:'3',flex:false,club:false,
     km:9,min:51,ctx:'Easy aerobic with strides. In heat run to HR and let the pace sit where it wants.',why:'Pure aerobic volume - the running that actually builds the marathon. Not a second quality day.',steps:[{l:'Main set',ty:'main',d:'9km',pace:'5:35-5:55',hr:'140-148',z:'Easy'},{l:'Strides',ty:'rest',d:'4 × 20s',pace:'build to 4:10',n:'In the last 2km. Walk back to full recovery after each.'}],desc:'<strong>Easy aerobic - 9km. Our session, not club.</strong><br><br><strong>Pace:</strong> 5:35-5:55/km (Z2, ~65% VAM). <strong>HR:</strong> 140-148, hard cap 148. <strong>RPE:</strong> 3.<br><br>Conversational the whole way. In heat, run to HR and let pace sit where it wants.<br><br><strong>Strides (last 2km):</strong> 4 x 20s, build to 4:10/km, walk back to full recovery each.<br><br><strong>Why:</strong> pure aerobic volume - the running that actually builds the marathon.'},{id:'club1',day:'Fri',t:'Easy',c:'te',rpe:'2',flex:false,club:false,km:8,min:46,ctx:'Trimmed to 8km because the long run moved to Saturday. Day before a big session - arrive with loose legs.',steps:[{l:'Main set',ty:'main',d:'8km',pace:'5:35-5:50',hr:'<145',z:'Easy'}],why:'Short and genuinely easy. Everything is saved for tomorrow.',desc:'8km easy at 5:35-5:50/km, HR under 145. Trimmed from 11km - the long run is now Saturday.'},{id:'long',day:'Sat 22',t:'Long run + parkrun finish',c:'tl',rpe:'6',flex:false,club:false,km:21.5,min:140,ctx:'Moved to Saturday (flying Sunday). The parkrun IS the MP block - it finishes the long run, it is not a race. About 45min at marathon pace across the session, in cool air. Start around 07:15 so you finish near 08:45 with time to get to the 09:00 start.',fuel:'Gel at 30 / 60 / 90min from the start of the long run, water with each. Take the 90min gel just before parkrun so it lands during it. Test your intended race breakfast, eaten at least 90min before you set off.',why:'Marathon pace on pre-fatigued legs, on a measured course, in 15C. This is the closest thing to km 30-35 of Cologne you can buy, and the HR reading is the most valuable number of the whole week.',steps:[{l:'Warm-up',ty:'wu',d:'15min',pace:'5:50+',hr:'<140',z:'Easy',n:'Ease in properly.'},{l:'Main set 1',ty:'main',d:'45min',pace:'5:30-5:45',hr:'135-148',z:'Easy'},{l:'Main set 2',ty:'main',d:'20min',pace:'4:55',hr:'record it',z:'MP',n:'Pre-load the legs so parkrun starts on marathon-pace fatigue, not fresh.'},{l:'Jog to start',ty:'cd',d:'5min',pace:'6:00+',z:'Easy',n:'Let HR settle. Do not stand still for long.'},{l:'Break',ty:'rest',d:'5-10min',n:'Toilet, drink, gel. Keep moving gently - the longer you stand, the more the legs stiffen.'},{l:'Main set 3 - parkrun',ty:'main',d:'5km',pace:'4:55',hr:'record it',z:'MP',n:'HOLD 4:55 FLAT. This is not a race and not a T-pace effort. Let the fast runners go. Only in the final kilometre, if it feels genuinely strong, allow it to drift to 4:45.'},{l:'Cool-down',ty:'cd',d:'1.5km',pace:'6:00+',z:'Easy',n:'Jog home.'}],desc:'<strong>Long run finishing with parkrun at marathon pace. Total ~21.5km, about 45min at MP.</strong><br><br><strong>07:15 START.</strong> 15min easy warm-up, 45min easy at 5:30-5:45, then <strong>20min at 4:55</strong>, then 5min easy jog to the parkrun start.<br><br><strong>BREAK:</strong> 5-10min. Toilet, drink, gel. Keep moving.<br><br><strong>PARKRUN (09:00):</strong> 5km at <strong>4:55 held flat</strong>. Not a race. Final km only, if strong, drift to 4:45.<br><br><strong>COOL-DOWN:</strong> 1.5km easy home.<br><br><strong>RECORD:</strong> average HR for the 20min block and for the parkrun. In 15C both should sit well below the 166-172 that 4:57 cost in 32C Valencia. That gap is your Cologne evidence.<br><br><strong>FUEL:</strong> race breakfast at least 90min before. Gels at 30 / 60 / 90min.<br><br><strong>TOTAL: ~21.5km.</strong>'},{id:'sun',day:'Sun 23',t:'Rest - travel',c:'tr2',rpe:'1',flex:false,club:false,km:0,ctx:'Flying home. Full rest.',steps:[{l:'Rest',ty:'cd',d:'Rest',n:'Travel day. Walk the aisle, drink plenty, and keep the legs moving at the airport. Compression socks if you have them.'}],why:'W13 starts Monday with the biggest week of the block. Arrive home recovered.',desc:'Rest and travel. W13 and the 30km key run start Monday.'}]},
 ]},
 {phase:'consolidation',label:'Marathon Block – Consolidation (Aug 24–Sep 13)',cls:'consolidation',pnote:'Peak volume. W13 Sunday is the defining session of the entire block: 30km with exact race-day nutrition. W15 Sunday is the peak long run: 32km. Between them, W14 is a recovery week. Do not skip it.',weeks:[
  {id:'mbw13',wk:'MB W13 (Aug 24–30) - ILLNESS',vol:'45km',tag:'',
   note:'ILLNESS WEEK. Chest infection - the T-pace peak session and the 30km key long run are cancelled. Return to running is gated on the neck rule, not on the calendar. W15 is now the single peak session week; W14 is the rebuild. Nothing meaningful is lost: the 25km with 90min at MP on 16 Aug already exceeded what this week prescribed.',
   sessions:[{id:'gym',day:'Mon 24',t:'Rest - ill',c:'tr2',rpe:'1',flex:false,club:false,km:0,ctx:'Rest. Illness week - the planned T-pace peak session and 30km key long run are cancelled, not postponed into this week.',steps:[{l:'Rest',ty:'cd',d:'Rest',n:'Nothing. Sleep and fluids.'}],desc:'Rest - ill.'},{id:'flex',day:'Tue 25',t:'Rest - ill',c:'tr2',rpe:'1',flex:false,club:false,km:0,ctx:'Rest.',steps:[{l:'Rest',ty:'cd',d:'Rest',n:'Nothing.'}],desc:'Rest - ill.'},{id:'wed',day:'Wed',t:'Easy - DONE',c:'te',rpe:'3',flex:false,club:false,km:6.2,min:33,ctx:'DONE Wed 26 Aug: 6.16km at 5:18/km, avg HR 153. First run back. Note the HR - 5:18 was costing you 141-143 before the illness, so 153 is the infection still being paid off. Completely normal, and the reason to keep the next few days capped.',steps:[{l:'Main set',ty:'main',d:'6.2km',pace:'5:18',hr:'153 avg',z:'Easy'}],why:'Test run passed. The real read was how you felt the next morning.',desc:'DONE Wed 26 Aug - 6.16km at 5:18/km, avg HR 153. First run back after the chest infection.'},{id:'club2',day:'Thu',t:'Easy - DONE',c:'te',rpe:'3',flex:false,club:false,km:10.5,min:60,ctx:'DONE Thu 27 Aug: 10.5km in 1h, about 5:43/km, run deliberately slow to test the chest. Right call and a good sign - an hour on feet two days after the first run back means the infection is clearing.',steps:[{l:'Main set',ty:'main',d:'10.5km',pace:'5:43',hr:'<145 target',z:'Very easy'}],why:'Volume before intensity. No quality until the easy runs feel completely normal.',desc:'DONE Thu 27 Aug - 10.5km in 1h, very slow by design. Testing the chest with time on feet.'},{id:'club1',day:'Fri / Sat',t:'Gym + easy',c:'te',rpe:'2',flex:false,club:false,km:8,ctx:'Fri was gym only - fine. Sat: 6-8km genuinely easy, or full rest if you would rather bank everything for Sunday. Either is acceptable; a short easy run is slightly preferable for rhythm.',steps:[{l:'Fri',ty:'main',d:'Gym',n:'Done.'},{l:'Sat',ty:'main',d:'6-8km',pace:'5:40+',hr:'<145',z:'Easy
